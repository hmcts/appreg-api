openapi: 3.0.4
info:
  description: "REST API for managing Administrative Tasks, Applications Lists, Application\
    \ List Entries and getting important, reference data including Application Codes,\
    \ Result Codes, Fees, Court Locations, Criminal Justice Areas and Standard Applicants."
  title: Applications Register API
  version: '@version@'
servers:
- url: /
tags:
- description: Administrative operations such as jobs can be run from this set of
    endpoints.
  name: admin
- description: "Application Codes are reference data, not managed in App Reg. They\
    \ are required to provide a set repeatable data that can be used by Application\
    \ List Entries, such as the title, wording or whether an application has an associated\
    \ fee."
  name: application-codes
- description: "An Application List records the date, time and location at which one\
    \ or more Applications is to be considered by a magistrate or delegated authority."
  name: application-lists
- description: An Application List Entry records all details of an individual Application.
    This will always belong to an Application List.
  name: application-list-entries
- description: An Application List Entry Result records the result of an individual
    Application. Each Application can have multiple child Results and Results cannot
    exist without a parent Application.
  name: application-list-entry-results
- description: "Court Locations are reference data, not managed in App Reg. They are\
    \ a consolidation of both crown and magistrates courts where an application will\
    \ be heard and resulted."
  name: court-locations
- description: "Criminal Justice Areas are reference data, not managed in App Reg.\
    \ They are officially recognized justice regions and used to classify records\
    \ by jurisdiction."
  name: criminal-justice-areas
- description: Background job operations for asynchronous tasks (polling status across
    all job types).
  name: jobs
- description: Endpoints to generate and retrieve CSV reports asynchronously.
  name: reports
- description: "Result codes are reference data, not managed in App Reg. They are\
    \ required to provide a set of ways an Application List Entry can be resulted.\
    \ e.g. Approved/Denied."
  name: result-codes
- description: "Standard Applicants are reference data, not managed in App Reg. They\
    \ are pre-registered individuals stored in the system to streamline applications\
    \ for recurring users, avoiding the need to manually re-enter their details each\
    \ time they create applications."
  name: standard-applicants
paths:
  /admin/jobs/{jobType}:
    get:
      description: Returns the current status and details of a background job.
      operationId: getJobStatus
      parameters:
      - description: The type of the job we are determining the status of.
        in: path
        name: jobType
        required: true
        schema:
          $ref: "#/components/schemas/admin-job-type"
      responses:
        "200":
          content:
            application/vnd.hmcts.appreg.v1+json:
              schema:
                $ref: "#/components/schemas/job-status"
          description: Job status retrieved successfully.
          headers:
            Vary:
              description: Response varies by Accept for media-type versioning.
              example: Accept
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  value:
                    type: https://errors.hmcts.net/common/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid credentials
              schema:
                $ref: "#/components/schemas/problem"
          description: Authentication required or token invalid.
        "409":
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/conflict
                    title: Conflict
                    status: 409
                    detail: The Application List could not be modified due to a conflict
                      with its current state
              schema:
                $ref: "#/components/schemas/problem"
          description: Conflict with the current state of the resource.
        "403":
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    type: https://errors.hmcts.net/common/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not have permission to access this resource
              schema:
                $ref: "#/components/schemas/problem"
          description: Authenticated but not permitted to perform this action.
        "404":
          content:
            application/problem+json:
              examples:
                missing:
                  value:
                    type: https://errors.hmcts.net/appreg/not-found
                    title: Not Found
                    status: 404
                    detail: Result code with id=123 was not found
              schema:
                $ref: "#/components/schemas/problem"
          description: The requested resource was not found.
        "500":
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/internal-error
                    title: Internal Server Error
                    status: 500
                    detail: An unexpected error occurred
              schema:
                $ref: "#/components/schemas/problem"
          description: Unexpected server error.
      summary: Get the status of a background job being processed in an administrative
        context.
      tags:
      - admin
    put:
      description: Enables or disables a database job by its name.
      operationId: enableDisableDatabaseJobByName
      parameters:
      - description: The name of the database job to trigger.
        example: APPLICATION_LISTS_DATABASE_JOB
        in: path
        name: jobType
        required: true
        schema:
          $ref: "#/components/schemas/admin-job-type"
      - description: Flag to enable (true) or disable (false) the database job.
        example: true
        in: query
        name: enable
        required: true
        schema:
          type: boolean
      responses:
        "200":
          description: Job enabled/disabled successfully.
        "401":
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  value:
                    type: https://errors.hmcts.net/common/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid credentials
              schema:
                $ref: "#/components/schemas/problem"
          description: Authentication required or token invalid.
        "403":
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    type: https://errors.hmcts.net/common/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not have permission to access this resource
              schema:
                $ref: "#/components/schemas/problem"
          description: Authenticated but not permitted to perform this action.
        "404":
          content:
            application/problem+json:
              examples:
                missing:
                  value:
                    type: https://errors.hmcts.net/appreg/not-found
                    title: Not Found
                    status: 404
                    detail: Result code with id=123 was not found
              schema:
                $ref: "#/components/schemas/problem"
          description: The requested resource was not found.
        "500":
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/internal-error
                    title: Internal Server Error
                    status: 500
                    detail: An unexpected error occurred
              schema:
                $ref: "#/components/schemas/problem"
          description: Unexpected server error.
      summary: Enable/Disable a database job by its name.
      tags:
      - admin
  /admin/jobs/{jobType}/retention-policy:
