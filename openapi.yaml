          type: string
      required:
      - addressLine1
      - addressLine2
      - addressLine3
      - addressLine4
      - addressLine5
      - code
      - emailAddress
      - forename1
      - forename2
      - forename3
      - mobileNumber
      - name
      - postcode
      - surname
      - telephoneNumber
      - title
      - useFrom
      - useTo
      type: object
    sort:
      description: Sorting state for the returned page.
      example:
        orders:
        - property: title
          direction: asc
        - property: code
          direction: desc
      properties:
        orders:
          description: Active sort orders in priority order.
          items:
            $ref: "#/components/schemas/sort_orders_inner"
          type: array
      type: object
    template-key-with-constraint:
      description: The template field with an associated value
      properties:
        key:
          description: Field key for substitution into the template.
          example: account-number
          type: string
        value:
          description: The optional value for the key.
          example: "12345678"
          type: string
        constraint:
          allOf:
          - $ref: "#/components/schemas/template-constraint"
          description: The constraint details for the field
      required:
      - constraint
      - field
      type: object
    bulk-action-selection-type:
      description: How the global bulk action selection should be resolved.
      enum:
      - FILTER
      - IDS
      type: string
    person:
      additionalProperties: false
      description: "The person making, or responding to, the application."
      properties:
        name:
          $ref: "#/components/schemas/full-name"
        contactDetails:
          $ref: "#/components/schemas/contact-details"
      required:
      - contactDetails
      - name
      type: object
    organisation:
      additionalProperties: false
      description: "The organisation making, or responding to, the application. Blank\
        \ fields will be rejected, nulls should be used instead."
      properties:
        name:
          description: The name of the organisation.
          example: ACME Industries LTD
          maxLength: 100
          minLength: 1
          pattern: "^[^\\u0000-\\u001F\\u007F-\\u009F]*$"
          type: string
        contactDetails:
          $ref: "#/components/schemas/contact-details"
      required:
      - contactDetails
      - name
      type: object
    payment-status:
      description: The Status of the Fee's Payment.
      enum:
      - PAID
      - UNDERTAKEN
      - DUE
      - REMITTED
      example: PAID
      type: string
    official-type:
      description: The type of Official hearing the application.
      enum:
      - MAGISTRATE
      - CLERK
      example: MAGISTRATE
      type: string
    template-constraint:
      description: The template field with an associated value
      properties:
        type:
          description: The data type of the value.
          enum:
          - TEXT
          example: TEXT
          type: string
        length:
          description: The length of the data value.
          example: 1234
          type: integer
      required:
      - length
      - type
      type: object
    full-name:
      additionalProperties: false
      description: "A persons full name. Blank fields will be rejected, nulls should\
        \ be used instead."
      properties:
        title:
          description: Prefix before a persons name.
          example: "Mr, Mrs"
          maxLength: 100
          minLength: 1
          pattern: "^[^\\u0000-\\u001F\\u007F-\\u009F]*$"
          type: string
        firstName:
          description: The person's first name.
          example: John
          maxLength: 100
          minLength: 1
          pattern: "^[^\\u0000-\\u001F\\u007F-\\u009F]*$"
          type: string
        middleName:
          description: The person's optional middle name or names.
          example: James
          maxLength: 100
          minLength: 1
          nullable: true
          pattern: "^[^\\u0000-\\u001F\\u007F-\\u009F]*$"
          type: string
        lastName:
          description: The person's family name.
          example: Smith
          maxLength: 100
          minLength: 1
          pattern: "^[^\\u0000-\\u001F\\u007F-\\u009F]*$"
          type: string
      required:
      - firstName
      - lastName
      type: object
    contact-details:
      additionalProperties: false
      description: "A participant's contact details. Blank fields will be rejected,\
        \ nulls should be used instead."
      properties:
        addressLine1:
          description: Line one of the participant's address.
          example: 10 Downing Street
          maxLength: 35
          minLength: 1
          nullable: false
          pattern: "^[^\\u0000-\\u001F\\u007F-\\u009F]*$"
          type: string
        addressLine2:
          description: Line two of the participant's address.
          example: Westminster
          maxLength: 35
          minLength: 1
          nullable: true
          pattern: "^[^\\u0000-\\u001F\\u007F-\\u009F]*$"
          type: string
        addressLine3:
          description: Line three of the participant's address.
          example: London
          maxLength: 35
          minLength: 1
          nullable: true
          pattern: "^[^\\u0000-\\u001F\\u007F-\\u009F]*$"
          type: string
        addressLine4:
          description: Line four of the participant's address.
          example: Greater London
          maxLength: 35
          minLength: 1
          nullable: true
          pattern: "^[^\\u0000-\\u001F\\u007F-\\u009F]*$"
          type: string
        addressLine5:
          description: Line five of the participant's address.
          example: United Kingdom
          maxLength: 35
          minLength: 1
          nullable: true
          pattern: "^[^\\u0000-\\u001F\\u007F-\\u009F]*$"
          type: string
        postcode:
          description: The participant's postcode.
          example: SW1A 2AA
          maxLength: 8
          minLength: 1
          nullable: false
          pattern: "^(([A-Z]{1,2}((\\d[A-Z\\d])|(\\d)) \\d[A-Z]{2})|(GIR 0A{2}))$"
          type: string
        phone:
          description: The participant's home-phone number.
          example: 01225 123456
          maxLength: 20
          minLength: 1
          nullable: true
          pattern: "[0-9 \\-]*"
          type: string
        mobile:
          description: The participant's mobile number.
          example: "07123456789"
          maxLength: 20
          minLength: 1
          nullable: true
          pattern: "^(?:\\+\\d{1,4}\\s*)?[0-9 \\-]*$"
          type: string
        email:
          description: The participant's email address.
          example: john-doe@gmail.com
          maxLength: 253
          minLength: 1
          nullable: true
          pattern: "^((([^<>()\\[\\]\\\\.,;:\\s@\"]+(\\.[^<>()\\[\\]\\\\.,;:\\s@\"\
            ]+)*)|(\".+\"))@((\\[[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}])|(([a-zA-Z\\\
            -0-9]+\\.)+[a-zA-Z]{2,})))*$"
          type: string
      required:
      - addressLine1
      type: object
    ingestCsdsData_request:
      properties:
        file:
          format: binary
          type: string
      required:
      - file
      type: object
    bulkUploadApplicationListEntries_request:
      properties:
        file:
          format: binary
          type: string
      type: object
    application_code_get_summary_dto_feeAmount:
      description: |
        Fee amount for this Application Code, expressed in pence (GBP minor units). Always use integer values; 1 GBP = 100 pence.
      nullable: true
      properties:
        value:
          description: Amount in pence.
          example: 1299
          format: int64
          minimum: 0
          type: integer
        currency:
          default: GBP
          description: ISO 4217 currency code (always "GBP" for now).
          enum:
          - GBP
          example: GBP
          type: string
      required:
      - value
      type: object
    application_code_get_summary_dto_offsiteFeeAmount:
      description: |
        Offsite Fee amount for this Application Code, expressed in pence (GBP minor units). Always use integer values; 1 GBP = 100 pence.
      nullable: true
      properties:
        value:
          description: Amount in pence.
          example: 1299
          format: int64
          minimum: 0
          type: integer
        currency:
          default: GBP
          description: ISO 4217 currency code (always "GBP" for now).
          enum:
          - GBP
          example: GBP
          type: string
      required:
      - value
      type: object
    respondent_person:
      allOf:
      - $ref: "#/components/schemas/person"
      - description: Person details for a respondent (includes DOB).
        properties:
          dateOfBirth:
            description: Date of birth (only applicable for person respondents).
            example: 1990-01-01
            format: date
            type: string
        type: object
    sort_orders_inner:
      properties:
        property:
          description: Property name used for sorting.
          example: title
          type: string
        direction:
          description: Sort direction.
          enum:
          - asc
          - desc
          example: asc
          type: string
      required:
      - direction
      - property
      type: object
