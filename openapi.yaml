        dateFrom:
          description: Inclusive start date (YYYY-MM-DD).
          example: 2025-10-01
          format: date
          type: string
        dateTo:
          description: Inclusive end date (YYYY-MM-DD).
          example: 2025-10-31
          format: date
          type: string
        username:
          description: Exact username to audit.
          example: jsmith
          minLength: 1
          pattern: .*\S.*
          type: string
        activityTypes:
          description: |
            One or more activity types to include in the audit report. Must contain at least one value.
          items:
            $ref: "#/components/schemas/activity-type"
          minItems: 1
          type: array
      required:
      - activityTypes
      - dateFrom
