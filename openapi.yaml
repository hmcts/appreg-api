  /admin/csds/{processor}/ingest:
    post:
      description: |
        Runs the requested CSDS processor synchronously against an uploaded JSON snapshot rendered from the reporting pipeline. The processor key in the path must be one of `application_codes`, `resolution_codes`, `fee`, `national_court_houses`, or `standard_applicants`. Implemented processors must also be enabled in CSDS ingress configuration; disabled processors return `409 Conflict`, and recognised but unimplemented processors return `501 Not Implemented`. The endpoint honours the distributed CSDS ingest lock and returns `423 Locked` if another run already owns it. The global 5MB multipart file limit applies.
      operationId: ingestCsdsData
      parameters:
      - description: CSDS processor key. This maps to the processor name used by the
          manual ingest path.
        in: path
        name: processor
        required: true
        schema:
          enum:
          - application_codes
          - resolution_codes
          - fee
          - national_court_houses
          - standard_applicants
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ingestCsdsData_request"
        required: true
      responses:
        "200":
          content:
            application/vnd.hmcts.appreg.v1+json:
              schema:
                $ref: "#/components/schemas/csds-ingest-response"
          description: CSDS ingest completed successfully.
          headers:
            Vary:
              description: Response varies by Accept for media-type versioning.
              example: Accept
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problem"
          description: Invalid request parameters.
        "401":
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  value:
                    type: https://errors.hmcts.net/common/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid credentials
              schema:
                $ref: "#/components/schemas/problem"
          description: Authentication required or token invalid.
        "403":
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    type: https://errors.hmcts.net/common/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not have permission to access this resource
              schema:
                $ref: "#/components/schemas/problem"
          description: Authenticated but not permitted to perform this action.
        "409":
          content:
            application/problem+json:
              examples:
                csds-conflict:
                  value:
                    type: https://errors.hmcts.net/common/conflict
                    title: The requested CSDS ingest processor is disabled
                    status: 409
                    detail: The requested CSDS ingest processor is disabled
              schema:
                $ref: "#/components/schemas/problem"
          description: The requested CSDS ingest processor is disabled.
        "413":
          content:
            application/problem+json:
              examples:
                payload-too-large:
                  value:
                    type: https://errors.hmcts.net/common/payload-too-large
                    title: Payload Too Large
                    status: 413
                    detail: Uploaded file must not be larger than 5MB
              schema:
                $ref: "#/components/schemas/problem"
          description: Request entity is too large to be processed.
        "415":
          content:
            application/problem+json:
              examples:
                unsupported-media-type:
                  value:
                    type: https://errors.hmcts.net/common/unsupported-media-type
                    title: Unsupported Media Type
                    status: 415
                    detail: The content type 'application/xml' is not supported. Expected
                      'text/csv' or 'multipart/form-data'.
              schema:
                $ref: "#/components/schemas/problem"
          description: The server does not support the media type of the request.
        "423":
          content:
            application/problem+json:
              examples:
                locked:
                  value:
                    type: https://errors.hmcts.net/common/locked
                    title: Locked
                    status: 423
                    detail: The CSDS ingest is already running
              schema:
                $ref: "#/components/schemas/problem"
          description: The requested operation could not start because the resource
            is locked.
        "500":
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/internal-error
                    title: Internal Server Error
                    status: 500
                    detail: An unexpected error occurred
              schema:
                $ref: "#/components/schemas/problem"
          description: Unexpected server error.
        "501":
          content:
            application/problem+json:
              examples:
                not-implemented:
                  value:
                    type: https://errors.hmcts.net/common/not-implemented
                    title: Not Implemented
                    status: 501
                    detail: The requested CSDS ingest processor is not implemented
                      yet
              schema:
                $ref: "#/components/schemas/problem"
          description: The requested processor is recognised but not yet implemented.
      summary: Ingest a CSDS snapshot file.
      tags:
      - admin
  /application-codes:
    get:
      description: |
        Returns a paginated list of Application Codes.
        - Filters:
          - `code` – case-insensitive partial match
          - `title` – case-insensitive partial match
      operationId: getApplicationCodes
      parameters:
      - description: "Filter by code (contains, case-insensitive)."
        example: AD99004
        in: query
        name: code
        schema:
          maxLength: 10
          type: string
      - description: "Filter by title (contains, case-insensitive)."
        example: Certificate of Satisfaction
        in: query
        name: title
        schema:
          maxLength: 500
          type: string
      - description: |
          ISO date (yyyy-MM-dd) on which returned Application Codes must be valid.
        example: 2021-01-01
        in: query
        name: date
        required: false
        schema:
          format: date
          type: string
      - description: Zero-based page index.
        in: query
        name: pageNumber
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - description: Page size.
        in: query
        name: pageSize
        schema:
          default: 10
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      - description: |
          Sort parameter. Format: `property,(asc|desc)`. Currently only a single sort value is supported. Example: `?sort=title,asc`.
          Supported properties:
            - `title`
            - `code`
            - `bulkRespondentAllowed`
            - `feeDue`
        explode: true
        in: query
        name: sort
        schema:
          example:
          - "title,asc"
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/vnd.hmcts.appreg.v1+json:
              schema:
                $ref: "#/components/schemas/application-code-page"
          description: Page of Application Codes
          headers:
            Vary:
              description: Response varies by Accept for media-type versioning.
              schema:
                example: Accept
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problem"
          description: Invalid request parameters.
        "401":
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  value:
                    type: https://errors.hmcts.net/common/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid credentials
              schema:
                $ref: "#/components/schemas/problem"
          description: Authentication required or token invalid.
        "403":
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    type: https://errors.hmcts.net/common/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not have permission to access this resource
              schema:
                $ref: "#/components/schemas/problem"
          description: Authenticated but not permitted to perform this action.
        "406":
          content:
            application/problem+json:
              examples:
                notAcceptable:
                  value:
                    type: https://errors.hmcts.net/common/not-acceptable
                    title: Not Acceptable
                    status: 406
                    detail: Requested media type/version not acceptable
              schema:
                $ref: "#/components/schemas/problem"
          description: Requested media type/version not acceptable.
        "500":
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/internal-error
                    title: Internal Server Error
                    status: 500
                    detail: An unexpected error occurred
              schema:
                $ref: "#/components/schemas/problem"
          description: Unexpected server error.
      summary: "Get Application Codes (paginated, filterable)"
      tags:
      - application-codes
