  schemas:
    application-code-get-summary-dto:
      description: "Lightweight DTO for Application Codes, used in list/search views."
      properties:
        applicationCode:
          description: Code that identifies the application.
          example: AD99003
          type: string
        title:
          description: Human-readable title.
          type: string
        wording:
          $ref: "#/components/schemas/template-detail"
        isFeeDue:
          description: |
            True if Application List Entries using this Application Code require an Application List Entry Fee Status to be created and linked.
          type: boolean
        requiresRespondent:
          description: |
            True if Application List Entries using this Application Code require a respondent to be created and linked.
          type: boolean
        bulkRespondentAllowed:
          description: |
            True if Application List Entries using this Application Code allow multiple respondents to be created and linked.
          type: boolean
        feeReference:
          description: A short reference code that identifies a Fee.
          example: CO5.2
          nullable: true
          type: string
        feeAmount:
          $ref: "#/components/schemas/application_code_get_summary_dto_feeAmount"
        feeDescription:
          description: Descriptive text for the fee.
          nullable: true
          type: string
        offsiteFeeReference:
          description: A short reference code that identifies a offsite Fee.
          example: CO1.1
          nullable: true
          type: string
        offsiteFeeAmount:
          $ref: "#/components/schemas/application_code_get_summary_dto_offsiteFeeAmount"
        offsiteFeeDescription:
          description: |
            Descriptive text for the offsite fee.
          example: Offsite Fee for application to Crown Court
          nullable: true
          type: string
      required:
      - applicationCode
      - bulkRespondentAllowed
      - isFeeDue
      - requiresRespondent
      - title
      - wording
      type: object
    admin-job-type:
      description: The type of the administrative background job
      enum:
      - APPLICATION_LISTS_DATABASE_JOB
      - REFRESH_REFERENCE_DATA
      example: APPLICATION_LISTS_DATABASE_JOB
      type: string
    job-status:
      description: Details of the database job status.
      properties:
        lastRan:
          description: The last time the job was run.
          format: date-time
          type: string
        enabled:
          description: Whether the job is currently enabled.
          example: true
          type: boolean
      type: object
    problem:
      description: RFC 9457/7807 problem details.
      properties:
        type:
          description: Problem type identifier (URI).
          example: https://errors.hmcts.net/appreg/bad-request
          format: uri
          type: string
        title:
          description: "Short, human-readable summary."
          example: Invalid request parameters
          type: string
        status:
          description: HTTP status code.
          example: 400
          format: int32
          type: integer
        detail:
          description: Human-readable explanation specific to this occurrence.
          example: startDateFrom must be on or before startDateTo
          type: string
        instance:
          description: URI reference to the specific occurrence (if applicable).
          example: urn:request:2f9c3d8a-1b3a-4a1e-9b7f-6b2a6a0a2b2f
          format: uri
          type: string
        correlationId:
          description: Server-side correlation ID for tracing.
          example: 3e1a2c95a7d84a5fb3e1a2c95a7d84a5
          type: string
      required:
      - status
      - title
      - type
      type: object
    job-retention-policy:
      additionalProperties: false
      description: Retention policy configuration for an administrative background
        job.
      properties:
        retentionPeriodDays:
          description: Number of days to retain closed application lists before deletion.
          example: 1825
          minimum: 1
          type: integer
      type: object
    csds-ingest-response:
      additionalProperties: false
      description: Summary returned when a CSDS ingest file has been processed.
      properties:
        inserted:
          description: Number of records inserted by the ingest.
          example: 12
          format: int32
          type: integer
        updated:
          description: Number of records updated by the ingest.
          example: 12
          format: int32
          type: integer
      required:
      - inserted
      - updated
      type: object
