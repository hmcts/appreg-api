parameters:
  - in: path
    name: listId
    required: true
    schema: { type: string, format: uuid }
    description: Public identifier of the Application List.
    example: "123e4567-e89b-12d3-a456-426655440000"
  - in: path
    name: entryId
    required: true
    schema: { type: string, format: uuid }
    description: Public identifier of the Application List Entry.
    example: "123e4567-e89b-12d3-a456-426655440000"
put:
  operationId: updateClosedApplicationListEntry
  tags: [ application-list-entries ]
  summary: Update a closed Application List Entry
  description: >
    Appends additional notes to an Application List Entry after its parent Application List has
    been closed. This is a command-style update and does not return an entry representation.
  requestBody:
    required: true
    content:
      application/vnd.hmcts.appreg.v1+json:
        schema: { $ref: "../../components/schemas/application-list-entries/entry_update_closed_dto.yaml" }
  responses:
    "204":
      description: Closed Application List Entry updated successfully (no content returned)
      headers:
        Vary:
          description: Response varies by Accept for media-type versioning.
          schema:
            type: string
            example: Accept
    "400": { $ref: "../../components/responses/bad-request-error.yaml" }
    "401": { $ref: "../../components/responses/unauthorized-error.yaml" }
    "403": { $ref: "../../components/responses/forbidden-error.yaml" }
    "404": { $ref: "../../components/responses/not-found-error.yaml" }
    "409": { $ref: "../../components/responses/conflict-error.yaml" }
    "500": { $ref: "../../components/responses/internal-server-error.yaml" }
