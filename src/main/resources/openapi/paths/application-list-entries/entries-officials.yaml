parameters:
  - in: path
    name: listId
    required: true
    schema: { type: string, format: uuid }
    description: ID of the Application List that owns the entries whose officials will be replaced.
    example: "9f7b2a35-57ac-4a1c-9c41-83b6c8157af4"

post:
  operationId: replaceApplicationListEntryOfficials
  tags: [ application-list-entries ]
  summary: Replace officials for multiple Application List Entries.
  description: >
    Atomically replaces the full officials array for each specified entry in the source list
    (path `listId`). If any entry cannot be updated, no officials are changed.
  requestBody:
    required: true
    content:
      application/vnd.hmcts.appreg.v1+json:
        schema:
          $ref: "../../components/schemas/application-list-entries/bulk-officials-update-dto.yaml"
  responses:
    "204":
      description: Officials replaced for all entries. No response body.
      headers:
        Vary:
          description: Response varies by Accept for media-type versioning.
          schema:
            type: string
            example: Accept
    "400": { $ref: "../../components/responses/bad-request-error.yaml" }
    "401": { $ref: "../../components/responses/unauthorized-error.yaml" }
    "403": { $ref: "../../components/responses/forbidden-error.yaml" }
    "404": { $ref: "../../components/responses/not-found-error.yaml" }
    "409": { $ref: "../../components/responses/conflict-error.yaml" }
    "500": { $ref: "../../components/responses/internal-server-error.yaml" }
