parameters:
  - in: path
    name: listId
    required: true
    schema: { type: string, format: uuid }
    description: Public identifier of the Application List.
    example: "123e4567-e89b-12d3-a456-426655440000"
get:
  operationId: getApplicationListEntryIds
  tags: [ application-list-entries ]
  summary: Get Application List Entry IDs (unpaged, filterable)
  description: Returns all matching Application List Entry IDs linked to a specific Application List.
  parameters:
    - in: query
      name: filter
      description: Filter criteria for Application List Entries.
      required: false
      style: form
      explode: true
      schema:
        $ref: "../../components/schemas/application-list-entries/entry-application-list-get-filter-dto.yaml"
  responses:
    "200":
      description: Matching Application List Entry IDs
      headers:
        Vary:
          description: Response varies by Accept for media-type versioning.
          schema:
            type: string
            example: Accept
      content:
        application/vnd.hmcts.appreg.v1+json:
          schema: { $ref: "../../components/schemas/application-list-entries/entry-ids-dto.yaml" }
    "400": { $ref: "../../components/responses/bad-request-error.yaml" }
    "401": { $ref: "../../components/responses/unauthorized-error.yaml" }
    "403": { $ref: "../../components/responses/forbidden-error.yaml" }
    "404": { $ref: "../../components/responses/not-found-error.yaml" }
    "406": { $ref: "../../components/responses/not-acceptable-error.yaml" }
    "500": { $ref: "../../components/responses/internal-server-error.yaml" }
