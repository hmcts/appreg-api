type: object
description: >
  Request payload to update an Application List Entry. Note, this is a PUT operation so the whole object is replaced.
  When `feeStatuses` is supplied it replaces the existing fee-status rows for the entry. When
  `feeStatuses` is `null`, fee-status rows are left unchanged. Blank fields will be rejected,
  nulls should be used instead.
additionalProperties: false
required:
  - applicationCode

properties:

  standardApplicantCode:
    type: string
    description: Code that identifies the Standard Applicant.
    example: "APP001"
    maxLength: 10
    minLength: 1

  applicationCode:
    type: string
    description: Code that identifies the Application Code.
    example: "APP001"
    maxLength: 10
    minLength: 1

  applicant:
    $ref: '../participants/applicant.yaml'

  respondent:
    $ref: '../participants/respondent.yaml'

  numberOfRespondents:
    type: integer
    description: Number of respondents required by the Application.
    example: 0
    format: int16

  wordingFields:
    type: array
    items: {$ref: '../common/template-substitution.yaml' }
    description: An array of user-provided values used to populate placeholders in the entry wording template, applied in the order they are provided.

  feeStatuses:
    type: array
    items: { $ref: '../fee-status/fee-status.yaml' }
    description: >
      Fee-status rows to persist for the entry. Providing a list replaces the existing fee-status
      rows. `null` means the existing fee-status rows are left unchanged. For application codes
      that do not require a fee, this operation allows existing historical fee-status rows to be
      retained unchanged, but rejects new, changed, or cleared fee-status rows.

  hasOffsiteFee:
    type: boolean
    description: Indicates whether an off-site fee applies.
    example: true

  caseReference:
    type: string
    maxLength: 15
    description: A reference code to identify a related case (maximum 15 characters).
    example: "CASE-001"
    minLength: 1

  accountNumber:
    type: string
    maxLength: 20
    description: The Applicant's account number (maximum 20 characters). Required when the Application Code starts with EF.
    example: "ACC-001"
    minLength: 1

  notes:
    type: string
    maxLength: 4000
    description: Notes about the application or the hearing (maximum 4000 characters).
    example: "Time is 10:31, we have convened to talk about Application..."
    minLength: 1

  officials:
    type: array
    items: { $ref: "../participants/official.yaml" }
    description: An array of Officials who will decide the outcome of the Application. A maximum of 4 officials may be supplied, with no more than 3 MAGISTRATE entries and no more than 1 CLERK entry.
    maxItems: 4
