type: object
description: >
  Request payload to update a closed Application List Entry.
additionalProperties: false
required:
  - additionalNotes

properties:
  additionalNotes:
    type: string
    description: The additional notes to append to the Application List Entry. Combined notes must not exceed 4000 characters.
    example: "Additional notes"
    maxLength: 4000
    minLength: 1
