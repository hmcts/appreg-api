type: object
description: >
  Request payload to update notes for an Application List Entry whose Application List is closed.
additionalProperties: false
required:
  - additionalNotes

properties:
  additionalNotes:
    type: string
    description: >
      The additional notes to append to the Application List Entry. Empty values are accepted and
      leave existing notes unchanged.
    example: "Additional notes"
    maxLength: 4000
    minLength: 0
