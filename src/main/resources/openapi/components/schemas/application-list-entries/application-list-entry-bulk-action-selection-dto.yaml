type: object
description: >
  Selection criteria for a single Application List bulk action preview.
  When selectionType is IDS, entryIds must contain at least one non-null entry ID.
  When selectionType is FILTER, filter, sort, and excludedEntryIds describe the select-all-matching selection.
additionalProperties: false
required:
  - selectionType

properties:

  selectionType:
    $ref: "./bulk-action-selection-type.yaml"

  filter:
    $ref: "./entry-application-list-get-filter-dto.yaml"

  sort:
    type: array
    description: >
      Sort order for the resolved selection. A single value is currently supported.
      Format: `property,(asc|desc)`.
    items:
      type: string
    example: [ "sequenceNumber,asc" ]

  entryIds:
    type: array
    description: Explicitly selected Application List Entry IDs.
    minItems: 1
    items:
      type: string
      format: uuid

  excludedEntryIds:
    type: array
    description: Entry IDs excluded from a select-all-matching filter selection.
    items:
      type: string
      format: uuid
