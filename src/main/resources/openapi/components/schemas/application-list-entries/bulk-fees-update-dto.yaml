type: object
description: Update fee details for multiple Application List Entries in one atomic operation.
additionalProperties: false
required:
  - entryIds
  - feeDetails

properties:

  entryIds:
    type: array
    description: >
      Array of entry IDs whose fee details should be updated. All must belong to the list in the path.
      Requests with more than 500 entry IDs are rejected with 400 Bad Request.
    minItems: 1
    maxItems: 500
    uniqueItems: true
    items:
      type: string
      format: uuid
    example: [ "3fa85f64-5717-4562-b3fc-2c963f66afa6", "3fa85f64-5717-4562-b3fc-2c963f66afa7" ]

  feeDetails:
    type: array
    description: >
      Array of fee detail rows to apply to every selected Application List Entry.
      At least one fee detail row must be provided.
    minItems: 1
    items:
      $ref: "./bulk-fee-details-dto.yaml"
