type: object
description: Append fee-status rows for multiple Application List Entries in one atomic operation.
additionalProperties: false
required:
  - entryIds

properties:

  entryIds:
    type: array
    description: >
      Array of entry IDs whose fee-status history should be appended to. All must belong to the list
      in the path.
      Requests with more than 1050 entry IDs are rejected with 400 Bad Request.
    minItems: 1
    maxItems: 1050
    uniqueItems: true
    items:
      type: string
      format: uuid
    example: [ "3fa85f64-5717-4562-b3fc-2c963f66afa6", "3fa85f64-5717-4562-b3fc-2c963f66afa7" ]

  feeDetails:
    type: array
    description: >
      Array of fee-status rows to append to every selected Application List Entry.
      Fee details is optional, but if provided, there must be at least a row.
    items:
      $ref: "./bulk-fee-details-dto.yaml"
    nullable: true

  hasOffsiteFee:
    type: boolean
    description: >
      If true, ensures that all selected entries have an off-site fee mapping. If false, it will remove the offsite fee.
      If not provided, the offsite fee will not be changed.
    default: false
    nullable: true
