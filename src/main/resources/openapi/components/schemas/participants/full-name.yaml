type: object
description: A persons full name. Blank fields will be rejected, nulls should be used instead.
required:
  - firstName
  - lastName
properties:

  title:
    type: string
    # Name regex from legacy.
    pattern: |-
      ^[^\u0000-\u001F\u007F-\u009F]*$
    description: Prefix before a persons name.
    example: "Mr, Mrs"
    maxLength: 100
    minLength: 1

  firstName:
    type: string
    description: The person's first name.
    # Name regex from legacy.
    pattern: |-
      ^[^\u0000-\u001F\u007F-\u009F]*$
    example: "John"
    maxLength: 100
    minLength: 1

  middleName:
    type: string
    description: The person's optional middle name or names.
    nullable: true
    # Name regex from legacy.
    pattern: |-
      ^[^\u0000-\u001F\u007F-\u009F]*$
    example: "James"
    maxLength: 100
    minLength: 1

  lastName:
    type: string
    description: The person's family name.
    # Name regex from legacy.
    pattern: |-
      ^[^\u0000-\u001F\u007F-\u009F]*$
    example: "Smith"
    maxLength: 100
    minLength: 1
