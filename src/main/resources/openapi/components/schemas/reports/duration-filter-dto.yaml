type: object
description: >
  Filter criteria for POST /reports/duration/jobs.
  Both dateFrom and dateTo are required inclusive bounds.
  Location is optional. Provide either courtLocationCode, otherLocationDescription,
  cjaCode, or cjaCode with otherLocationDescription.
  A cjaCode-only filter also includes court lists whose court code maps to that CJA.
  Blank fields will be rejected; use null instead.
additionalProperties: false
required:
  - dateFrom
  - dateTo

properties:

  dateFrom:
    type: string
    format: date
    description: Inclusive start date (YYYY-MM-DD).
    example: "2025-10-01"

  dateTo:
    type: string
    format: date
    description: Inclusive end date (YYYY-MM-DD).
    example: "2025-10-31"

  location:
    $ref: '../common/location.yaml'
