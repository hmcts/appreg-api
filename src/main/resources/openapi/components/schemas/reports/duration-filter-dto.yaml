type: object
description: >
  Filter criteria for POST /reports/duration/jobs.
  Both dateFrom and dateTo are required inclusive bounds.
  If dateFrom is later than dateTo, the API treats the earlier date as the
  inclusive start and the later date as the inclusive end.
  Location is optional. When provided, use either courtLocationCode on its own,
  or both cjaCode and otherLocationDescription together. When supplied,
  cjaCode must match an existing Criminal Justice Area and courtLocationCode
  must match an active Court. Blank fields will be rejected; use null instead.
additionalProperties: false
required:
  - dateFrom
  - dateTo

properties:

  dateFrom:
    type: string
    format: date
    description: Inclusive start date (YYYY-MM-DD).
    example: "2025-10-01"

  dateTo:
    type: string
    format: date
    description: Inclusive end date (YYYY-MM-DD).
    example: "2025-10-31"

  location:
    $ref: './legacy-report-location.yaml'
