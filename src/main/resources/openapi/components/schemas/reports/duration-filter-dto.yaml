type: object
description: >
  Filter criteria for POST /reports/duration/jobs.
  Both dateFrom and dateTo are required inclusive bounds.
  Location is optional and follows the legacy MIS Duration report filtering semantics.
  When no cjaCode is supplied, courtLocationCode and otherLocationDescription are
  case-insensitive contains matches and can be combined. A cjaCode-only filter includes
  rows explicitly stored against that CJA and court rows whose court code maps to that CJA.
  A cjaCode with otherLocationDescription and no courtLocationCode matches explicit CJA
  other-location rows. Other location combinations are accepted for legacy compatibility
  and may return no rows.
  Blank fields will be rejected; use null instead.
additionalProperties: false
required:
  - dateFrom
  - dateTo

properties:

  dateFrom:
    type: string
    format: date
    description: Inclusive start date (YYYY-MM-DD).
    example: "2025-10-01"

  dateTo:
    type: string
    format: date
    description: Inclusive end date (YYYY-MM-DD).
    example: "2025-10-31"

  location:
    $ref: './legacy-report-location.yaml'
