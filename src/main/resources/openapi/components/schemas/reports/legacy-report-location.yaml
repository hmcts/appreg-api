type: object
title: LegacyReportLocation
description: >
  Location filters for legacy MIS reports. Blank fields will be rejected,
  nulls should be used instead. Location is optional. courtLocationCode can
  be used on its own and must not be combined with cjaCode or
  otherLocationDescription. When courtLocationCode is absent, cjaCode and
  otherLocationDescription can each be used separately or together.

properties:

  courtLocationCode:
      type: string
      description: Court location code (case-insensitive contains match).
      example: "LOC123"
      maxLength: 10
      minLength: 1
      pattern: '.*\S.*'

  otherLocationDescription:
      type: string
      description: Other location description (case-insensitive contains match).
      example: "town hall"
      maxLength: 200
      minLength: 1
      pattern: '.*\S.*'

  cjaCode:
      type: string
      description: >
        Criminal Justice Area code. Can be supplied by itself or with
        otherLocationDescription.
      example: "52"
      maxLength: 2
      minLength: 1
      pattern: '.*\S.*'
