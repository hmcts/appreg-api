type: object
title: LegacyReportLocation
description: >
  Location filters for legacy MIS reports. Blank fields will be rejected,
  nulls should be used instead. When provided, use either courtLocationCode
  on its own, or both cjaCode and otherLocationDescription together.
  courtLocationCode is mutually exclusive with cjaCode and
  otherLocationDescription.

properties:

  courtLocationCode:
      type: string
      description: Court location code (case-insensitive contains match).
      example: "LOC123"
      maxLength: 10
      minLength: 1
      pattern: '.*\S.*'

  otherLocationDescription:
      type: string
      description: Other location description (case-insensitive contains match).
      example: "town hall"
      maxLength: 200
      minLength: 1
      pattern: '.*\S.*'

  cjaCode:
      type: string
      description: >
        Criminal Justice Area code. Must be supplied with
        otherLocationDescription.
      example: "52"
      maxLength: 2
      minLength: 1
      pattern: '.*\S.*'
