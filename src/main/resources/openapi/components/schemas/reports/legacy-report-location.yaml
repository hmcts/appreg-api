type: object
title: LegacyReportLocation
description: >
  Location filters for legacy MIS reports. Blank fields will be rejected,
  nulls should be used instead. Location is optional. courtLocationCode
  must be supplied on its own. cjaCode and otherLocationDescription may be
  supplied independently or together.

properties:

  courtLocationCode:
      type: string
      description: Court location code (case-insensitive contains match).
      example: "LOC123"
      maxLength: 10
      minLength: 1
      pattern: '.*\S.*'

  otherLocationDescription:
      type: string
      description: Other location description (case-insensitive contains match).
      example: "town hall"
      maxLength: 200
      minLength: 1
      pattern: '.*\S.*'

  cjaCode:
      type: string
      description: >
        Criminal Justice Area code.
      example: "52"
      maxLength: 2
      minLength: 1
      pattern: '.*\S.*'
