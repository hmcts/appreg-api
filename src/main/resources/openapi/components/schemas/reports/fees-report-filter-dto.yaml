type: object
description: >
  Filter criteria for POST /reports/fees/jobs.
  Both dateFrom and dateTo are required and are treated as inclusive bounds.
  If dateFrom is later than dateTo, the API treats the earlier date as the
  inclusive start and the later date as the inclusive end.
additionalProperties: false
required:
  - dateFrom
  - dateTo

properties:

  dateFrom:
    type: string
    format: date
    description: Inclusive start date (YYYY-MM-DD).
    example: "2025-10-01"

  dateTo:
    type: string
    format: date
    description: Inclusive end date (YYYY-MM-DD).
    example: "2025-10-31"

  standardApplicantCode:
    type: string
    description: Standard applicant code (exact match).
    example: "STD-00123"
    maxLength: 10
    minLength: 1

  applicantName:
    type: string
    description: Applicant display name (case-insensitive contains match). For people this is searched as "{forename} {surname}".
    example: "john smith"
    maxLength: 100
    minLength: 1

  applicantOrganisation:
    type: string
    description: Applicant organisation name (case-insensitive contains match).
    example: "acme"
    maxLength: 100
    minLength: 1

  location:
    $ref: '../common/location.yaml'
