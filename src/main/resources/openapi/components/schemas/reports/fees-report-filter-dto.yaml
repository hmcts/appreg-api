type: object
description: >
  Filter criteria for POST /reports/fees/jobs.
  Both dateFrom and dateTo are required and are treated as inclusive bounds.
  If dateFrom is later than dateTo, the API treats the earlier date as the
  inclusive start and the later date as the inclusive end.
  Location is optional. courtLocationCode must be supplied on its own. cjaCode
  and otherLocationDescription may be supplied independently or together. When
  supplied, cjaCode must match an existing Criminal Justice Area and
  courtLocationCode must match an active Court.
additionalProperties: false
required:
  - dateFrom
  - dateTo

properties:

  dateFrom:
    type: string
    format: date
    description: Inclusive start date (YYYY-MM-DD).
    example: "2025-10-01"

  dateTo:
    type: string
    format: date
    description: Inclusive end date (YYYY-MM-DD).
    example: "2025-10-31"

  standardApplicantCode:
    type: string
    description: Standard applicant code (case-insensitive contains match).
    example: "STD-00123"
    maxLength: 10
    minLength: 1
    pattern: '.*\S.*'

  applicantName:
    type: string
    description: Applicant name, surname, or organisation name (case-insensitive contains match).
    example: "john smith"
    maxLength: 100
    minLength: 1
    pattern: '.*\S.*'

  location:
    $ref: './legacy-report-location.yaml'
