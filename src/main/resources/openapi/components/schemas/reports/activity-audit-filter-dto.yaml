type: object
description: >
  Filter criteria for POST /reports/activity-audit/jobs.
  Both dateFrom and dateTo are required and are treated as inclusive bounds.
  If dateFrom is later than dateTo, the API treats the earlier date as the
  inclusive start and the later date as the inclusive end.
  The username must match exactly.
  Blank fields will be rejected, nulls should be used instead.
additionalProperties: false
required:
  - dateFrom
  - dateTo
  - activityTypes

properties:

  dateFrom:
    type: string
    format: date
    description: Inclusive start date (YYYY-MM-DD).
    example: "2025-10-01"

  dateTo:
    type: string
    format: date
    description: Inclusive end date (YYYY-MM-DD).
    example: "2025-10-31"

  username:
    type: string
    description: Exact username to audit.
    example: "jsmith"
    minLength: 1
    pattern: '.*\S.*'

  activityTypes:
    type: array
    description: >
      One or more activity types to include in the audit report.
      Must contain at least one value.
    minItems: 1
    items:
      $ref: "./activity-type.yaml"
