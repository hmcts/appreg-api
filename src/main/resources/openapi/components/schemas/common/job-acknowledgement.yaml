type: object
description: Acknowledgement returned when a background job is created.
additionalProperties: false
required:
  - id
  - type
  - status

properties:
  id:
    type: string
    format: uuid
    description: Unique identifier for the job, in UUID v4 format.
    example: "9f7b2a35-57ac-4a1c-9c41-83b6c8157af4"

  type:
    $ref: './job-type.yaml'

  status:
    $ref: './job-status.yaml'

  mainFeeTotal:
    type: number
    x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
    description: >
      Current main fees in GBP for non-deleted applications created by this upload,
      regardless of payment or remission status. Available only when polling a completed
      BULK_UPLOAD_ENTRIES job; zero when no applicable fees remain. Calculated on read,
      so later changes to applications or associated fees can change this value.
      Omitted from all other responses.
    example: 120.50

  offsiteFeeTotal:
    type: number
    x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
    description: >
      Current applicable offsite fees in GBP for non-deleted applications created by this
      upload, regardless of payment or remission status. Available only when polling a
      completed BULK_UPLOAD_ENTRIES job; zero when no applicable fees remain.
      Calculated on read, not an upload-time snapshot. Omitted from all other responses.
    example: 30.25

  totalFeeValue:
    type: number
    x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
    description: >
      Sum of mainFeeTotal and offsiteFeeTotal in GBP. Available only when polling a completed
      BULK_UPLOAD_ENTRIES job. Zero when no applicable fees remain; calculated on read.
      Omitted from all other responses.
    example: 150.75

  error_description:
    description: >
      Details of a failed job. Bulk-upload validation failures may include actionable input errors;
      unexpected bulk-upload processing failures use a generic message and identify the job
      reference to quote to support.
    type: string
