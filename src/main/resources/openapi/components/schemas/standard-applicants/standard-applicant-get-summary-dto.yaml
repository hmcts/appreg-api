type: object
description: Standard Applicant reference data. Only code, name and usage dates are exposed; personal and contact details are excluded.
required:
  - code
  - startDate
  - endDate
properties:
  code:
    type: string
    description: Code that identifies the Standard Applicant.
    example: "STANDARD-1"
  name:
    type: string
    description: Standard Applicant name. Never derived from personal name fields.
    example: "Standard Applicant 1"
  startDate:
    type: string
    format: date
    description: Date the applicant record became active.
    example: "2025-12-01"
  endDate:
    type: string
    format: date
    nullable: true
    description: Date the applicant record became inactive, or null if still active.
    example: "2025-12-01"
