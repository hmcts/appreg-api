type: object
description: Search criteria used for the Standard Applicants print report.
required:
  - code
  - name
  - from
  - to
properties:
  code:
    type: string
    nullable: true
  name:
    type: string
    nullable: true
  from:
    type: string
    format: date
    x-field-extra-annotation: '@uk.gov.hmcts.appregister.common.validator.DateValidator'
    nullable: true
  to:
    type: string
    format: date
    x-field-extra-annotation: '@uk.gov.hmcts.appregister.common.validator.DateValidator'
    nullable: true
