type: object
description: Standard Applicant print row containing only code, name and usage dates. Personal and contact details are excluded.
required:
  - code
  - useFrom
  - name
  - useTo
properties:
  code: { type: string, nullable: true }
  useFrom: { type: string, format: date, nullable: true }
  name: { type: string, nullable: true }
  useTo: { type: string, format: date, nullable: true }
