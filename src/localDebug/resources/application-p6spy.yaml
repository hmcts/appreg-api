spring:
  datasource:
    url: jdbc:p6spy:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:appreg-db}?reWriteBatchedInserts=true
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
  jpa:
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 25
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

logging:
  level:
    p6spy: INFO
