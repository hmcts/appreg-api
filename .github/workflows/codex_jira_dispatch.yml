name: Codex Jira Dispatch

on:
  workflow_dispatch:
    inputs:
      issueKey:
        description: Jira issue key
        required: true
        type: string
      summary:
        description: Jira issue summary
        required: true
        type: string
      description:
        description: Jira issue description
        required: true
        type: string
      status:
        description: Jira issue status
        required: true
        type: string
      assignee:
        description: Jira assignee
        required: true
        type: string
      issueUrl:
        description: Jira issue URL
        required: true
        type: string

jobs:
  codex-plan-action:
    runs-on: codex-pilot-azure-aks
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      codex_result: ${{ steps.codex-action.outputs.final-message }}
      trusted_sha: ${{ steps.trusted.outputs.sha }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_SUMMARY: ${{ inputs.summary }}
      ISSUE_DESCRIPTION: ${{ inputs.description }}
      ISSUE_STATUS: ${{ inputs.status }}
      ISSUE_ASSIGNEE: ${{ inputs.assignee }}
      ISSUE_URL: ${{ inputs.issueUrl }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture trusted checkout SHA
        id: trusted
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Verify runner toolchain
        run: ./.github/scripts/codex-runner-preflight.sh

      - name: Prepare read-only planning prompt
        id: prepare
        run: ./.github/scripts/codex-jira-plan.sh

      - name: Plan implementation
        id: codex-action
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.CODEX_OPENAI_API_KEY }}
          responses-api-endpoint: https://eu.api.openai.com/v1/responses
          codex-version: '0.146.0'
          model: gpt-5.6-sol
          effort: ultra
          prompt-file: ${{ steps.prepare.outputs.prompt_path }}
          output-schema-file: ${{ steps.prepare.outputs.schema_path }}
          working-directory: .
          permission-profile: ":read-only"
          safety-strategy: unprivileged-user
          codex-user: codex
          codex-args: '["--ephemeral"]'

  validate-codex-plan:
    needs: codex-plan-action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ready_to_implement: ${{ steps.validate.outputs.ready_to_implement }}
      plan_sha256: ${{ steps.validate.outputs.plan_sha256 }}
      plan_payload: ${{ steps.validate.outputs.plan_payload }}
      planned_path_count: ${{ steps.validate.outputs.planned_path_count }}
      trusted_sha: ${{ steps.trusted.outputs.sha }}

    steps:
      - name: Checkout trusted plan validator
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.codex-plan-action.outputs.trusted_sha }}
          persist-credentials: false

      - name: Confirm trusted checkout SHA
        id: trusted
        env:
          EXPECTED_TRUSTED_SHA: ${{ needs.codex-plan-action.outputs.trusted_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_TRUSTED_SHA}"
          echo "sha=${actual_sha}" >>"$GITHUB_OUTPUT"

      - name: Validate and normalise Codex plan
        id: validate
        env:
          CODEX_PLAN_RESULT: ${{ needs.codex-plan-action.outputs.codex_result }}
          OUTPUT_DIR: ${{ runner.temp }}/codex-plan
        run: ./.github/scripts/validate-codex-plan.py

      - name: Record non-sensitive planning audit
        env:
          READY_TO_IMPLEMENT: ${{ steps.validate.outputs.ready_to_implement }}
          PLAN_SHA256: ${{ steps.validate.outputs.plan_sha256 }}
          PLANNED_PATH_COUNT: ${{ steps.validate.outputs.planned_path_count }}
        run: |
          {
            echo "### Codex planning audit"
            echo
            echo "- Ready to implement: \`${READY_TO_IMPLEMENT}\`"
            echo "- Plan approval: \`automatic after trusted validation\`"
            echo "- Planned file count: \`${PLANNED_PATH_COUNT}\`"
            echo "- Plan SHA-256: \`${PLAN_SHA256}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

  codex-plan-blocked:
    needs: validate-codex-plan
    if: needs.validate-codex-plan.outputs.ready_to_implement == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Stop workflow with terminal blocked result
        env:
          PLAN_SHA256: ${{ needs.validate-codex-plan.outputs.plan_sha256 }}
        run: |
          {
            echo "### Codex planning blocked"
            echo
            echo "No implementation or pull request was created. Review the Jira ticket and this workflow run."
            echo
            echo "Plan SHA-256: \`${PLAN_SHA256}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
          echo "::error title=Codex plan blocked::The validated plan is not ready to implement; no implementation or pull request was created."
          exit 1

  prepare-codex-verification-source:
    needs: [codex-plan-action, validate-codex-plan]
    if: >-
      ${{
        needs.validate-codex-plan.result == 'success' &&
        needs.validate-codex-plan.outputs.ready_to_implement == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact: codex-verification-source
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Checkout planned repository revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.codex-plan-action.outputs.trusted_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build credential-free verification source
        id: source
        env:
          EXPECTED_TRUSTED_SHA: ${{ needs.codex-plan-action.outputs.trusted_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_TRUSTED_SHA}"
          echo "sha=${EXPECTED_TRUSTED_SHA}" >>"$GITHUB_OUTPUT"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
          test -z "$(git config --local --get-all credential.helper || true)"
          tar -czf "$RUNNER_TEMP/codex-verification-source.tar.gz" .

      - name: Upload credential-free verification source
        uses: actions/upload-artifact@v7
        with:
          name: codex-verification-source
          path: ${{ runner.temp }}/codex-verification-source.tar.gz
          if-no-files-found: error
          retention-days: 1

  codex-generate-action:
    needs: [codex-plan-action, validate-codex-plan]
    if: >-
      ${{
        needs.validate-codex-plan.result == 'success' &&
        needs.validate-codex-plan.outputs.ready_to_implement == 'true'
      }}
    runs-on: codex-pilot-azure-aks
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      branch_name: ${{ steps.prepare.outputs.branch_name }}
      codex_result: ${{ steps.codex-action.outputs.final-message }}
      trusted_sha: ${{ steps.trusted.outputs.sha }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_SUMMARY: ${{ inputs.summary }}
      ISSUE_DESCRIPTION: ${{ inputs.description }}
      ISSUE_STATUS: ${{ inputs.status }}
      ISSUE_ASSIGNEE: ${{ inputs.assignee }}
      ISSUE_URL: ${{ inputs.issueUrl }}

    steps:
      - name: Checkout planned repository revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.codex-plan-action.outputs.trusted_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm planned repository revision
        id: trusted
        env:
          EXPECTED_TRUSTED_SHA: ${{ needs.codex-plan-action.outputs.trusted_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_TRUSTED_SHA}"
          echo "sha=${actual_sha}" >>"$GITHUB_OUTPUT"

      - name: Verify runner toolchain
        run: ./.github/scripts/codex-runner-preflight.sh

      - name: Materialise validated Codex plan
        env:
          CODEX_PLAN_PAYLOAD: ${{ needs.validate-codex-plan.outputs.plan_payload }}
          EXPECTED_PLAN_SHA: ${{ needs.validate-codex-plan.outputs.plan_sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/codex-plan
        run: ./.github/scripts/validate-codex-plan.py --materialize

      - name: Prepare Codex prompt
        id: prepare
        env:
          PLAN_DIR: ${{ runner.temp }}/codex-plan
        run: ./.github/scripts/codex-jira-implement.sh

      - name: Run Codex
        id: codex-action
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.CODEX_OPENAI_API_KEY }}
          responses-api-endpoint: https://eu.api.openai.com/v1/responses
          codex-version: '0.146.0'
          model: gpt-5.6-sol
          effort: medium
          prompt-file: ${{ steps.prepare.outputs.prompt_path }}
          output-schema-file: ${{ steps.prepare.outputs.schema_path }}
          working-directory: .
          permission-profile: ":workspace"
          safety-strategy: unprivileged-user
          codex-user: codex
          codex-args: '["--ephemeral"]'

  codex-generate:
    needs: [codex-generate-action, validate-codex-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      branch_name: ${{ steps.codex.outputs.branch_name }}
      has_changes: ${{ steps.codex.outputs.has_changes }}
      trusted_sha: ${{ steps.trusted.outputs.sha }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_SUMMARY: ${{ inputs.summary }}
      ISSUE_URL: ${{ inputs.issueUrl }}

    steps:
      - name: Checkout trusted collector
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.codex-generate-action.outputs.trusted_sha }}
          persist-credentials: false

      - name: Confirm trusted checkout SHA
        id: trusted
        env:
          EXPECTED_TRUSTED_SHA: ${{ needs.codex-generate-action.outputs.trusted_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_TRUSTED_SHA}"
          echo "sha=${actual_sha}" >>"$GITHUB_OUTPUT"

      - name: Materialise validated Codex plan
        env:
          CODEX_PLAN_PAYLOAD: ${{ needs.validate-codex-plan.outputs.plan_payload }}
          EXPECTED_PLAN_SHA: ${{ needs.validate-codex-plan.outputs.plan_sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/codex-plan
        run: ./.github/scripts/validate-codex-plan.py --materialize

      - name: Materialise Codex patch result
        id: codex
        env:
          CODEX_RESULT: ${{ needs.codex-generate-action.outputs.codex_result }}
          CODEX_OPERATION: jira-generate
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
          BRANCH_NAME: ${{ needs.codex-generate-action.outputs.branch_name }}
          PLAN_DIR: ${{ runner.temp }}/codex-plan
        run: ./.github/scripts/codex-jira-collect.sh

      - name: Upload Codex output
        uses: actions/upload-artifact@v7
        with:
          name: codex-jira-output
          path: ${{ runner.temp }}/codex-output
          if-no-files-found: error
          retention-days: 1

  verify-codex-output:
    needs: [codex-generate, prepare-codex-verification-source, validate-codex-plan]
    if: needs.codex-generate.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    outputs:
      passed: ${{ steps.verify.outputs.passed }}
      output_artifact: codex-jira-output
      verified_artifact: codex-jira-verified-0
      failure_artifact: codex-jira-verification-failure-0
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_BRANCH_NAME: ${{ needs.codex-generate.outputs.branch_name }}
      LOCAL_PIPELINE_MODE: fast
      CODEX_OUTPUT_ARTIFACT: codex-jira-output
      CODEX_VERIFIED_ARTIFACT: codex-jira-verified-0
      CODEX_FAILURE_ARTIFACT: codex-jira-verification-failure-0

    steps:
      - name: Download credential-free verification source
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-codex-verification-source.outputs.artifact }}
          path: ${{ runner.temp }}/codex-verification-source

      - name: Restore credential-free verification source
        run: tar -xzf "$RUNNER_TEMP/codex-verification-source/codex-verification-source.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Download Codex output
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output

      - name: Verify Codex patch
        id: verify
        env:
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
        run: |
          set +e
          ./.github/scripts/codex-jira-verify.sh >"$RUNNER_TEMP/codex-verification.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/codex-verification.log"
          if [[ "${status}" -eq 0 ]]; then
            echo "passed=true" >>"$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/codex-verification-failure"
            cp "$RUNNER_TEMP/codex-verification.log" "$RUNNER_TEMP/codex-verification-failure/verification-failure.log"
            tail -n 240 "$RUNNER_TEMP/codex-verification.log" >"$RUNNER_TEMP/codex-verification-failure/verification-failure-summary.log"
            echo "passed=false" >>"$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload verified Codex output
        if: steps.verify.outputs.passed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_VERIFIED_ARTIFACT }}
          path: |
            ${{ runner.temp }}/codex-output/codex-pr-body.md
            ${{ runner.temp }}/codex-output/guardrail-changes.txt
            ${{ runner.temp }}/codex-output/verification.env
          if-no-files-found: error
          retention-days: 1

      - name: Upload verification failure
        if: steps.verify.outputs.passed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-verification-failure
          if-no-files-found: error
          retention-days: 1

  repair-codex-output-1-action:
    needs: [codex-generate, verify-codex-output, validate-codex-plan]
    if: needs.codex-generate.outputs.has_changes == 'true' && needs.verify-codex-output.outputs.passed != 'true'
    runs-on: codex-pilot-azure-aks
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      branch_name: ${{ steps.prepare.outputs.branch_name }}
      codex_result: ${{ steps.codex-action.outputs.final-message }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_SUMMARY: ${{ inputs.summary }}
      ISSUE_DESCRIPTION: ${{ inputs.description }}
      ISSUE_STATUS: ${{ inputs.status }}
      ISSUE_ASSIGNEE: ${{ inputs.assignee }}
      ISSUE_URL: ${{ inputs.issueUrl }}
      REPAIR_ATTEMPT: "1"
      MAX_CODEX_REPAIR_ATTEMPTS: "3"
      CODEX_INPUT_ARTIFACT: ${{ needs.verify-codex-output.outputs.output_artifact }}
      CODEX_FAILURE_ARTIFACT: ${{ needs.verify-codex-output.outputs.failure_artifact }}
      CODEX_OUTPUT_ARTIFACT: codex-jira-output-repair-1

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.codex-generate.outputs.trusted_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner toolchain
        run: ./.github/scripts/codex-runner-preflight.sh

      - name: Download Codex output to repair
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_INPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-input

      - name: Download verification failure
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-failure

      - name: Materialise validated Codex plan
        env:
          CODEX_PLAN_PAYLOAD: ${{ needs.validate-codex-plan.outputs.plan_payload }}
          EXPECTED_PLAN_SHA: ${{ needs.validate-codex-plan.outputs.plan_sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/codex-plan
        run: ./.github/scripts/validate-codex-plan.py --materialize

      - name: Prepare Codex repair prompt
        id: prepare
        env:
          INPUT_DIR: ${{ runner.temp }}/codex-input
          FAILURE_DIR: ${{ runner.temp }}/codex-failure
          PLAN_DIR: ${{ runner.temp }}/codex-plan
        run: ./.github/scripts/codex-jira-repair.sh

      - name: Run Codex repair
        id: codex-action
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.CODEX_OPENAI_API_KEY }}
          responses-api-endpoint: https://eu.api.openai.com/v1/responses
          codex-version: '0.146.0'
          model: gpt-5.6-sol
          effort: medium
          prompt-file: ${{ steps.prepare.outputs.prompt_path }}
          output-schema-file: ${{ steps.prepare.outputs.schema_path }}
          working-directory: .
          permission-profile: ":workspace"
          safety-strategy: unprivileged-user
          codex-user: codex
          codex-args: '["--ephemeral"]'

  repair-codex-output-1:
    needs: [codex-generate, verify-codex-output, repair-codex-output-1-action, validate-codex-plan]
    if: needs.verify-codex-output.outputs.passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      branch_name: ${{ steps.repair.outputs.branch_name }}
      has_changes: ${{ steps.repair.outputs.has_changes }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_SUMMARY: ${{ inputs.summary }}
      ISSUE_URL: ${{ inputs.issueUrl }}
      CODEX_INPUT_ARTIFACT: ${{ needs.verify-codex-output.outputs.output_artifact }}
      CODEX_OUTPUT_ARTIFACT: codex-jira-output-repair-1

    steps:
      - name: Checkout trusted collector
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.codex-generate.outputs.trusted_sha }}
          persist-credentials: false

      - name: Download Codex output being repaired
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_INPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-input

      - name: Materialise validated Codex plan
        env:
          CODEX_PLAN_PAYLOAD: ${{ needs.validate-codex-plan.outputs.plan_payload }}
          EXPECTED_PLAN_SHA: ${{ needs.validate-codex-plan.outputs.plan_sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/codex-plan
        run: ./.github/scripts/validate-codex-plan.py --materialize

      - name: Materialise repaired Codex patch
        id: repair
        env:
          CODEX_RESULT: ${{ needs.repair-codex-output-1-action.outputs.codex_result }}
          CODEX_OPERATION: jira-repair
          INPUT_DIR: ${{ runner.temp }}/codex-input
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
          PLAN_DIR: ${{ runner.temp }}/codex-plan
          BRANCH_NAME: ${{ needs.repair-codex-output-1-action.outputs.branch_name }}
          REPAIR_ATTEMPT: '1'
        run: ./.github/scripts/codex-jira-collect.sh

      - name: Upload repaired Codex output
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output
          if-no-files-found: error
          retention-days: 1

  verify-codex-output-1:
    needs: [codex-generate, repair-codex-output-1, prepare-codex-verification-source, validate-codex-plan]
    if: needs.repair-codex-output-1.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    outputs:
      passed: ${{ steps.verify.outputs.passed }}
      output_artifact: codex-jira-output-repair-1
      verified_artifact: codex-jira-verified-1
      failure_artifact: codex-jira-verification-failure-1
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_BRANCH_NAME: ${{ needs.codex-generate.outputs.branch_name }}
      LOCAL_PIPELINE_MODE: fast
      CODEX_OUTPUT_ARTIFACT: codex-jira-output-repair-1
      CODEX_VERIFIED_ARTIFACT: codex-jira-verified-1
      CODEX_FAILURE_ARTIFACT: codex-jira-verification-failure-1

    steps:
      - name: Download credential-free verification source
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-codex-verification-source.outputs.artifact }}
          path: ${{ runner.temp }}/codex-verification-source

      - name: Restore credential-free verification source
        run: tar -xzf "$RUNNER_TEMP/codex-verification-source/codex-verification-source.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Download Codex output
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CODEX_OUTPUT_ARTIFACT }}
          path: ${{ runner.temp }}/codex-output

      - name: Verify Codex patch
        id: verify
        env:
          OUTPUT_DIR: ${{ runner.temp }}/codex-output
        run: |
          set +e
          ./.github/scripts/codex-jira-verify.sh >"$RUNNER_TEMP/codex-verification.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/codex-verification.log"
          if [[ "${status}" -eq 0 ]]; then
            echo "passed=true" >>"$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/codex-verification-failure"
            cp "$RUNNER_TEMP/codex-verification.log" "$RUNNER_TEMP/codex-verification-failure/verification-failure.log"
            tail -n 240 "$RUNNER_TEMP/codex-verification.log" >"$RUNNER_TEMP/codex-verification-failure/verification-failure-summary.log"
            echo "passed=false" >>"$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload verified Codex output
        if: steps.verify.outputs.passed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_VERIFIED_ARTIFACT }}
          path: |
            ${{ runner.temp }}/codex-output/codex-pr-body.md
            ${{ runner.temp }}/codex-output/guardrail-changes.txt
            ${{ runner.temp }}/codex-output/verification.env
          if-no-files-found: error
          retention-days: 1

      - name: Upload verification failure
        if: steps.verify.outputs.passed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CODEX_FAILURE_ARTIFACT }}
          path: ${{ runner.temp }}/codex-verification-failure
          if-no-files-found: error
          retention-days: 1

  repair-codex-output-2-action:
    needs: [codex-generate, verify-codex-output-1, validate-codex-plan]
    if: needs.verify-codex-output-1.outputs.passed == 'false'
    runs-on: codex-pilot-azure-aks
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      branch_name: ${{ steps.prepare.outputs.branch_name }}
      codex_result: ${{ steps.codex-action.outputs.final-message }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_SUMMARY: ${{ inputs.summary }}
      ISSUE_DESCRIPTION: ${{ inputs.description }}
      ISSUE_STATUS: ${{ inputs.status }}
      ISSUE_ASSIGNEE: ${{ inputs.assignee }}
      ISSUE_URL: ${{ inputs.issueUrl }}
      REPAIR_ATTEMPT: "2"
      MAX_CODEX_REPAIR_ATTEMPTS: "3"
      CODEX_INPUT_ARTIFACT: ${{ needs.verify-codex-output-1.outputs.output_artifact }}
      CODEX_FAILURE_ARTIFACT: ${{ needs.verify-codex-output-1.outputs.failure_artifact }}
