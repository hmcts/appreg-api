name: Codex Jira Dispatch

run-name: Codex Jira Dispatch - ${{ inputs.issueKey }}

on:
  workflow_dispatch:
    inputs:
      issueKey:
        description: Jira issue key
        required: true
        type: string
      summary:
        description: Jira issue summary
        required: true
        type: string
      description:
        description: Jira issue description
        required: true
        type: string
      status:
        description: Jira issue status
        required: true
        type: string
      assignee:
        description: Jira assignee
        required: true
        type: string
      issueUrl:
        description: Jira issue URL
        required: true
        type: string
      initiatorDisplayName:
        description: Display name of the Jira user who initiated the automation
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: codex-jira-${{ inputs.issueKey }}
  cancel-in-progress: false

jobs:
  implement:
    uses: hmcts/codex-agent-workflows/.github/workflows/codex-implement.yml@5f481616d558a7495e4d83826dd9aa6191197fd2
    with:
      issueKey: ${{ inputs.issueKey }}
      summary: ${{ inputs.summary }}
      description: ${{ inputs.description }}
      status: ${{ inputs.status }}
      assignee: ${{ inputs.assignee }}
      issueUrl: ${{ inputs.issueUrl }}
      initiatorDisplayName: ${{ inputs.initiatorDisplayName }}
      runner_label: codex-pilot-azure-aks
      runner_group: appreg-codex
      model_environment: codex-model
      publisher_environment: codex-publisher
      java_version: "21"
      github_app_client_id: ${{ vars.CODEX_GITHUB_APP_CLIENT_ID }}
      publish_policy: verified-only
      cannot_be_built: repair
      plan_policy: strict
    secrets:
      CODEX_OPENAI_API_KEY: ${{ secrets.CODEX_OPENAI_API_KEY }}
      CODEX_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_GITHUB_APP_PRIVATE_KEY }}
      CODEX_JIRA_PR_NOTIFY_URL: ${{ secrets.CODEX_JIRA_PR_NOTIFY_URL }}
