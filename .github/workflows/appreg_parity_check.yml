name: Apps Reg Legacy Parity Check

on:
  workflow_dispatch:
    inputs:
      issueKey:
        description: Jira issue key
        required: true
        type: string
      summary:
        description: Jira issue summary
        required: true
        type: string
      description:
        description: Jira issue description
        required: true
        type: string
      status:
        description: Jira issue status
        required: true
        type: string
      assignee:
        description: Jira assignee
        required: true
        type: string
      issueUrl:
        description: Jira issue URL
        required: true
        type: string
      workflowType:
        description: Dispatch workflow type
        required: true
        type: string

jobs:
  parity-check:
    runs-on: codex-pilot-azure-aks
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      codex_outcome: ${{ steps.codex-action.outcome }}
      parity_result: ${{ steps.codex-action.outputs.final-message }}
      snapshot_id: ${{ steps.prepare.outputs.snapshot_id }}
      trusted_sha: ${{ steps.trusted.outputs.sha }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_SUMMARY: ${{ inputs.summary }}
      ISSUE_DESCRIPTION: ${{ inputs.description }}
      ISSUE_STATUS: ${{ inputs.status }}
      ISSUE_ASSIGNEE: ${{ inputs.assignee }}
      ISSUE_URL: ${{ inputs.issueUrl }}
      WORKFLOW_TYPE: ${{ inputs.workflowType }}

    steps:
      - name: Validate workflow type
        run: |
          if [[ "${WORKFLOW_TYPE}" != "parity-check" ]]; then
            echo "Unexpected workflowType: ${WORKFLOW_TYPE}" >&2
            exit 1
          fi

      - name: Initialise workflow paths
        run: echo "OUTPUT_DIR=${RUNNER_TEMP}/parity-output" >>"${GITHUB_ENV}"

      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture trusted checkout SHA
        id: trusted
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Verify runner toolchain
        run: ./.github/scripts/codex-runner-preflight.sh

      - name: Download and verify legacy snapshot
        env:
          APPREG_LEGACY_SNAPSHOT_URL: ${{ secrets.APPREG_LEGACY_SNAPSHOT_URL }}
          APPREG_LEGACY_SNAPSHOT_SHA256: ${{ secrets.APPREG_LEGACY_SNAPSHOT_SHA256 }}
        run: |
          set -euo pipefail

          if [[ -z "${APPREG_LEGACY_SNAPSHOT_URL}" ]]; then
            echo "APPREG_LEGACY_SNAPSHOT_URL secret is required." >&2
            exit 1
          fi

          if [[ -z "${APPREG_LEGACY_SNAPSHOT_SHA256}" ]]; then
            echo "APPREG_LEGACY_SNAPSHOT_SHA256 secret is required." >&2
            exit 1
          fi

          snapshot_archive="${RUNNER_TEMP}/appreg-legacy.tar.gz"
          snapshot_extract_dir="${RUNNER_TEMP}/appreg-legacy-extract"

          curl --fail --silent --show-error --location \
            "${APPREG_LEGACY_SNAPSHOT_URL}" \
            --output "${snapshot_archive}"

          printf '%s  %s\n' "${APPREG_LEGACY_SNAPSHOT_SHA256}" "${snapshot_archive}" | sha256sum -c -

          mkdir -p "${snapshot_extract_dir}"
          tar -xzf "${snapshot_archive}" -C "${snapshot_extract_dir}"

          if [[ -d "${snapshot_extract_dir}/appreg-legacy" ]]; then
            legacy_snapshot_dir="${snapshot_extract_dir}/appreg-legacy"
          else
            legacy_snapshot_dir="${snapshot_extract_dir}"
          fi

          if [[ ! -s "${legacy_snapshot_dir}/manifest.json" ]]; then
            echo "Legacy snapshot must contain manifest.json." >&2
            exit 1
          fi

          echo "LEGACY_SNAPSHOT_DIR=${legacy_snapshot_dir}" >>"${GITHUB_ENV}"

      - name: Prepare parity prompt
        id: prepare
        run: ./.github/scripts/codex-parity-check.sh

      - name: Run report-only parity check
        id: codex-action
        continue-on-error: true
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.CODEX_OPENAI_API_KEY }}
          responses-api-endpoint: https://eu.api.openai.com/v1/responses
          codex-version: '0.146.0'
          prompt-file: ${{ steps.prepare.outputs.prompt_path }}
          output-file: ${{ steps.prepare.outputs.final_message_path }}
          output-schema-file: ${{ steps.prepare.outputs.schema_path }}
          working-directory: .
          permission-profile: ":read-only"
          safety-strategy: unprivileged-user
          codex-user: codex
          codex-args: '["--ephemeral", "--add-dir", "${{ steps.prepare.outputs.legacy_snapshot_dir }}"]'

  parity-notify:
    needs: parity-check
    if: ${{ always() && inputs.workflowType == 'parity-check' && needs.parity-check.outputs.trusted_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CODEX_ACTION_OUTCOME: ${{ needs.parity-check.outputs.codex_outcome }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_KEY: ${{ inputs.issueKey }}
      ISSUE_URL: ${{ inputs.issueUrl }}
      SNAPSHOT_ID: ${{ needs.parity-check.outputs.snapshot_id }}

    steps:
      - name: Checkout trusted notification scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.parity-check.outputs.trusted_sha }}
          persist-credentials: false

      - name: Validate and sanitise parity result
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.parity-check.outputs.parity_result }}
          OUTPUT_DIR: ${{ runner.temp }}/parity-output
        run: ./.github/scripts/collect-parity-result.py

      - name: Notify Jira parity result
        env:
          CODEX_JIRA_PARITY_NOTIFY_URL: ${{ secrets.CODEX_JIRA_PARITY_NOTIFY_URL }}
          CODEX_JIRA_PARITY_NOTIFY_TIMEOUT_SECONDS: ${{ vars.CODEX_JIRA_PARITY_NOTIFY_TIMEOUT_SECONDS || '10' }}
          OUTPUT_DIR: ${{ runner.temp }}/parity-output
        run: ./.github/scripts/notify-jira-parity-result.py --report "${OUTPUT_DIR}/parity-report.json"

      - name: Preserve Codex failure status
        if: ${{ env.CODEX_ACTION_OUTCOME != 'success' }}
        run: |
          echo "Codex parity execution did not succeed: ${CODEX_ACTION_OUTCOME:-not-run}" >&2
          exit 1
