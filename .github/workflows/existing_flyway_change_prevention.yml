name: Block merge if restricted directory changes

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-directory-change:
    runs-on: ubuntu-latest
    env:
      GIT_AUTH_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN || github.token }}
    steps:
      - name: Checkout PR
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper \
            '!f() { test "$1" = get && echo username=x-access-token && echo "password=$GIT_AUTH_TOKEN"; }; f'
          git fetch --no-tags --prune --depth=1 origin \
            "refs/pull/${{ github.event.pull_request.number }}/merge"
          git checkout --detach FETCH_HEAD

      - name: Check for changes under restricted directory
        id: check_changes
        run: |
          # Get a list of changed files compared to base
          git fetch --no-tags --prune --depth=1 origin \
            "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          CHANGED_FILES=$(git diff  --name-status origin/${{ github.event.pull_request.base.ref }} HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Block only if modified (M) files exist under flyway/
          if echo "$CHANGED_FILES" | grep -E '^(M|D)\s+flyway/'; then
            echo "🚫 Existing files under flyway/ were modified."
            exit 1
          else
            echo "✅ No existing restricted files modified (new files are allowed)."
          fi
