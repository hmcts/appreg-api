name: Check for duplicate Flyway scripts
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
permissions:
  id-token: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GIT_AUTH_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN || github.token }}
    steps:
      - name: Checkout PR merge
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_AUTH_TOKEN" | base64 | tr -d '\n')"
          git fetch --no-tags --prune --depth=1 origin \
            "refs/pull/${{ github.event.pull_request.number }}/merge"
          git checkout --detach FETCH_HEAD

      - name: Check for duplicate Flyway scripts
        run: |
          set -e
          
          flyway_script_count=$(find ./flyway -type f | wc -l | jq -r)
          echo "Flyway migration script count: $flyway_script_count"
          
          readarray -t unique_numbers < <(find ./flyway -type f | awk -F '__' '{print $1}' | sort | uniq -c)
          echo "Unique flyway migration script count: ${#unique_numbers[@]}"
          
          if [ "$flyway_script_count" -ne "${#unique_numbers[@]}" ]; then
          echo "Duplicate flyway migration scripts found"
          exit 1
          fi
