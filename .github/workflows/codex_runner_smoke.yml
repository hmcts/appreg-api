name: Codex Runner Smoke Test

on:
  workflow_dispatch:
    inputs:
      branch_prefix:
        description: Branch prefix for the smoke-test push
        required: false
        default: codex-runner-smoke

permissions: {}

jobs:
  codex-auth-smoke:
    runs-on: codex-pilot-azure-aks
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify runner toolchain
        run: ./.github/scripts/codex-runner-preflight.sh

      - name: Prepare authentication prompt
        run: |
          mkdir -p "$RUNNER_TEMP/codex-smoke"
          printf '%s\n' 'Reply exactly CODEX_SMOKE_OK. Do not run commands or modify files.' \
            >"$RUNNER_TEMP/codex-smoke/prompt.md"
          chmod -R g+rwX "$GITHUB_WORKSPACE" "$RUNNER_TEMP/codex-smoke"

      - name: Verify Codex API authentication
        id: codex-action
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.CODEX_OPENAI_API_KEY }}
          responses-api-endpoint: https://eu.api.openai.com/v1/responses
          codex-version: '0.146.0'
          model: gpt-5.6-sol
          effort: ultra
          prompt-file: ${{ runner.temp }}/codex-smoke/prompt.md
          output-file: ${{ runner.temp }}/codex-smoke/final-message.md
          permission-profile: ":read-only"
          safety-strategy: unprivileged-user
          codex-user: codex
          codex-args: '["--ephemeral"]'

      - name: Stop Codex API proxy
        if: always() && steps.codex-action.outcome != 'skipped'
        run: |
          set -euo pipefail
          server_info="/home/codex/.codex/${GITHUB_RUN_ID}.json"
          test -s "$server_info"
          proxy_port="$(jq -r '.port // empty' "$server_info")"
          [[ "$proxy_port" =~ ^[0-9]+$ ]]
          curl --fail --silent --show-error "http://127.0.0.1:${proxy_port}/shutdown" >/dev/null

      - name: Verify authentication response
        run: grep -qx 'CODEX_SMOKE_OK' "$RUNNER_TEMP/codex-smoke/final-message.md"

  branch-smoke:
    needs: codex-auth-smoke
    runs-on: codex-pilot-azure-aks
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BRANCH_PREFIX: ${{ inputs.branch_prefix }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CODEX_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEX_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Verify GitHub App publisher
        id: publisher
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GITHUB_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: python3 -I .github/scripts/codex-verify-publisher.py

      - name: Verify runner toolchain
        run: ./.github/scripts/codex-runner-preflight.sh

      - name: Configure Git identity
        run: |
          git config user.name "${{ steps.publisher.outputs.publisher_login }}"
          git config user.email "${{ steps.publisher.outputs.publisher_email }}"

      - name: Create, commit, and push a smoke-test branch
        id: smoke
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./.github/scripts/codex-runner-branch-smoke.sh

      - name: Write workflow summary
        run: |
          {
            echo "## Codex runner smoke test"
            echo
            echo "- Runner: ${RUNNER_NAME}"
            echo "- Branch: ${{ steps.smoke.outputs.branch_name }}"
            echo "- Commit: ${{ steps.smoke.outputs.commit_sha }}"
            echo "- File: ${{ steps.smoke.outputs.smoke_file }}"
          } >>"$GITHUB_STEP_SUMMARY"
