name: Codex Runner Smoke Test

on:
  workflow_dispatch:
    inputs:
      branch_prefix:
        description: Branch prefix for the smoke-test push
        required: false
        default: codex-runner-smoke

permissions: {}

jobs:
  codex-auth-smoke:
    runs-on: codex-pilot-azure-aks
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify runner toolchain
        run: ./.github/scripts/codex-runner-preflight.sh

      - name: Make the checkout readable by the Codex user
        run: chmod -R g+rX "$GITHUB_WORKSPACE"

      - name: Verify Codex API authentication
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.CODEX_OPENAI_API_KEY }}
          responses-api-endpoint: https://eu.api.openai.com/v1/responses
          permission-profile: ":read-only"
          safety-strategy: unprivileged-user
          codex-user: codex
          prompt: "Reply exactly CODEX_SMOKE_OK. Do not run commands or modify files."
          codex-args: '["--ephemeral"]'

  branch-smoke:
    needs: codex-auth-smoke
    runs-on: codex-pilot-azure-aks
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BRANCH_PREFIX: ${{ inputs.branch_prefix }}
      GH_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN || github.token }}

    steps:
      - name: Checkout default branch
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper \
            '!f() { test "$1" = get && echo username=x-access-token && echo "password=$GH_TOKEN"; }; f'
          git fetch --prune --no-tags origin "${DEFAULT_BRANCH}"
          git checkout -B "${DEFAULT_BRANCH}" FETCH_HEAD

      - name: Verify runner toolchain
        run: ./.github/scripts/codex-runner-preflight.sh

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create, commit, and push a smoke-test branch
        id: smoke
        run: ./.github/scripts/codex-runner-branch-smoke.sh

      - name: Write workflow summary
        run: |
          {
            echo "## Codex runner smoke test"
            echo
            echo "- Runner: ${RUNNER_NAME}"
            echo "- Branch: ${{ steps.smoke.outputs.branch_name }}"
            echo "- Commit: ${{ steps.smoke.outputs.commit_sha }}"
            echo "- File: ${{ steps.smoke.outputs.smoke_file }}"
          } >>"$GITHUB_STEP_SUMMARY"
