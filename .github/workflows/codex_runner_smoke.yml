name: Codex Runner Smoke Test

on:
  workflow_dispatch:
    inputs:
      branch_prefix:
        description: Branch prefix for the smoke-test push
        required: false
        default: codex-runner-smoke

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: codex-pilot-azure-aks
    timeout-minutes: 30
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BRANCH_PREFIX: ${{ inputs.branch_prefix }}
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Verify runner toolchain and Codex auth
        run: ./.github/scripts/codex-runner-preflight.sh

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create, commit, and push a smoke-test branch
        id: smoke
        run: ./.github/scripts/codex-runner-branch-smoke.sh

      - name: Write workflow summary
        run: |
          {
            echo "## Codex runner smoke test"
            echo
            echo "- Runner: ${RUNNER_NAME}"
            echo "- Branch: ${{ steps.smoke.outputs.branch_name }}"
            echo "- Commit: ${{ steps.smoke.outputs.commit_sha }}"
            echo "- File: ${{ steps.smoke.outputs.smoke_file }}"
          } >>"$GITHUB_STEP_SUMMARY"
