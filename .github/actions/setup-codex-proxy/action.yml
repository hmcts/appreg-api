name: Set up secure Codex proxy
description: Starts the official Codex Responses API credential proxy.

inputs:
  openai-api-key:
    description: OpenAI API key supplied by GitHub Actions secrets.
    required: true

runs:
  using: composite
  steps:
    - name: Start Codex Responses API proxy
      uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
      with:
        openai-api-key: ${{ inputs['openai-api-key'] }}
        responses-api-endpoint: https://eu.api.openai.com/v1/responses
        safety-strategy: unprivileged-user
        codex-user: codex

    - name: Export non-secret Codex runtime settings
      shell: bash
      run: |
        echo "CODEX_ACTION_HOME=/home/codex/.codex" >>"$GITHUB_ENV"
        echo "CODEX_RUN_USER=codex" >>"$GITHUB_ENV"
