import com.github.jk1.license.filter.LicenseBundleNormalizer
import com.github.jk1.license.render.JsonReportRenderer
import com.github.jk1.license.render.SimpleHtmlReportRenderer
import com.github.benmanes.gradle.versions.updates.resolutionstrategy.ComponentFilter
import com.github.benmanes.gradle.versions.updates.resolutionstrategy.ComponentSelectionWithCurrent
import org.openapitools.generator.gradle.plugin.tasks.GenerateTask
import org.springframework.boot.gradle.tasks.run.BootRun

buildscript {
  configurations.classpath {
    resolutionStrategy.eachDependency { details ->
      if (!System.getProperty('data.connection_string')
        && details.requested.group == 'org.owasp'
        && details.requested.name.startsWith('dependency-check')) {
        details.useVersion '12.2.2'
        details.because '12.2.0 fails importing some NVD CVE reference URLs into the local H2 store'
      }
    }
  }
}

plugins {
  id 'application'
  id 'jacoco'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.springframework.boot' version '4.1.0'
  id 'com.github.ben-manes.versions' version '0.54.0'
  id 'org.sonarqube' version '7.3.1.8318'
  id 'org.openapi.generator' version '7.23.0'
  id 'io.freefair.lombok' version '9.5.0'
  /*
    Applies analysis tools including checkstyle and OWASP Dependency checker.
    See https://github.com/hmcts/gradle-java-plugin
 */
  id 'uk.gov.hmcts.java' version '0.12.70'
  id 'com.diffplug.spotless' version '8.8.0'
  id 'org.openrewrite.rewrite' version '7.36.0'
  id 'maven-publish'
  id 'com.github.jk1.dependency-license-report' version '3.1.4'
}

ext {
  releaseTrainVersion = '2025.1.2' // Example: '2021.0.x' corresponds to Spring Boot 2.6.x or 2.7.x
}

def buildNumber = System.getenv('RELEASE_VERSION') ?: 'DEV-SNAPSHOT'

checkstyle {
  toolVersion = '13.7.0'
  checkstyleMain.exclude '**/uk/gov/hmcts/appregister/generated/**'
  checkstyleMain.exclude '**/org/openapitools/**'
  maxWarnings = 0
}

dependencyManagement {
  imports {
    mavenBom "org.springframework.cloud:spring-cloud-dependencies:${releaseTrainVersion}"
    mavenBom 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.29.0'
  }
}

application {
  mainClass = 'uk.gov.hmcts.appregister.Application'
  group = 'uk.gov.hmcts.appregister'
  version = buildNumber
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}


spotless {
  java {
    // files to format
    target 'src/**/*.java'
    googleJavaFormat('1.22.0').aosp()
    trimTrailingWhitespace()
    endWithNewline()

    // Expand single-line Javadocs into multi-line
    replaceRegex(
      'Expand one-line Javadocs',
      '(?m)^/\\*\\* (.+) \\*/$',
      '/**\n * $1\n */'
    )
  }
}

rewrite {
  activeRecipes = [
    'org.openrewrite.staticanalysis.NeedBraces',
    'org.openrewrite.java.OrderImports'
  ]
}

tasks.withType(JavaCompile).configureEach {
  options.warnings = true
  options.deprecation = false
  options.compilerArgs.removeAll(['-Werror'])
  options.compilerArgs += ['-Xlint:all,-deprecation', '-Xdiags:verbose']
}

// https://github.com/gradle/gradle/issues/16791
tasks.withType(JavaExec).configureEach {
  javaLauncher.set(javaToolchains.launcherFor(java.toolchain))
}

tasks.withType(Test).configureEach {
  enabled = true
  useJUnitPlatform()
  failFast = true
  maxHeapSize = '1024m'

  testLogging {
    exceptionFormat = 'full'
  }
}

sourceSets {

  main {
    resources {
      srcDirs = [
        layout.buildDirectory.dir('generated/openapi/src/main/java'),
        'src/main/java',
        'src/main/resources',
        'flyway'
      ]
    }
    java {
      java.srcDirs files(layout.buildDirectory.dir('generated/openapi/src/main/java'))
    }
  }

  testCommon {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/testCommon/java')
    }
    resources.srcDir file('src/testCommon/resources')
  }

  // Ensure main source set includes resources from flyway directory
  functionalTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      compileClasspath += testCommon.output
      runtimeClasspath += testCommon.output
      srcDir file('src/functionalTest/java')
    }
    resources.srcDir file('src/functionalTest/resources')
  }

  integrationTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      compileClasspath += testCommon.output
      runtimeClasspath += testCommon.output
      srcDir file('src/integrationTest/java')
    }
    resources.srcDir file('src/integrationTest/resources')
  }

  smokeTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      compileClasspath += testCommon.output
      runtimeClasspath += testCommon.output
      srcDir file('src/smokeTest/java')
    }
    resources.srcDir file('src/smokeTest/resources')
  }

  test {
    java {
      compileClasspath += main.output
      compileClasspath += testCommon.output
      runtimeClasspath += main.output
      runtimeClasspath += testCommon.output
      srcDir file('src/test/java')
    }
    resources.srcDir file('src/test/resources')
  }
}

configurations {
  localDebugRuntimeOnly {
    canBeConsumed = false
    canBeResolved = true
  }

  testCommonImplementation.extendsFrom testImplementation

  functionalTestImplementation.extendsFrom testImplementation
  functionalTestRuntimeOnly.extendsFrom runtimeOnly

  integrationTestImplementation.extendsFrom testCommonImplementation
  integrationTestRuntimeOnly.extendsFrom runtimeOnly

  smokeTestImplementation.extendsFrom testImplementation
  smokeTestRuntimeOnly.extendsFrom runtimeOnly
}

tasks.register('functional', Test) {
  description = 'Runs functional tests'
  group = 'Verification'
  testClassesDirs = sourceSets.functionalTest.output.classesDirs
  classpath = files(sourceSets.functionalTest.runtimeClasspath, sourceSets.testCommon.runtimeClasspath)
}

tasks.register('integration', Test) {
  description = 'Runs integration tests'
  group = 'Verification'
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = files(sourceSets.integrationTest.runtimeClasspath, sourceSets.testCommon.runtimeClasspath)
}

tasks.register('smoke', Test) {
  description = 'Runs Smoke Tests'
  testClassesDirs = sourceSets.smokeTest.output.classesDirs
  classpath = files(sourceSets.smokeTest.runtimeClasspath, sourceSets.testCommon.runtimeClasspath)
}

tasks.register('bootRunLocalDev', BootRun) {
  description = 'Runs the application locally with no security and P6Spy SQL logging enabled'
  group = 'Application'
  mainClass = application.mainClass

  dependsOn tasks.named('copySpecIntoLocalDebugResources')

  classpath = sourceSets.main.runtimeClasspath +
    configurations.localDebugRuntimeOnly +
    files('src/localDebug/resources') +
    files(layout.buildDirectory.dir('localDebug/resources'))

  def activeProfiles = providers.gradleProperty('springProfiles')
    .orElse(providers.systemProperty('spring.profiles.active'))
    .orElse('nosecurity,p6spy')

  systemProperty 'spring.profiles.active', activeProfiles.get()
}

tasks.register('bootRunLocalDevAppLogging', BootRun) {
  description = 'Runs the application locally with no security and the normal application.yaml logging'
  group = 'Application'
  mainClass = application.mainClass

  dependsOn tasks.named('copySpecIntoLocalDebugResources')

  classpath = sourceSets.main.runtimeClasspath +
    configurations.localDebugRuntimeOnly +
    files('src/localDebug/resources') +
    files(layout.buildDirectory.dir('localDebug/resources'))

  def activeProfiles = providers.gradleProperty('springProfiles')
    .orElse(providers.systemProperty('spring.profiles.active'))
    .orElse('nosecurity')

  systemProperty 'spring.profiles.active', activeProfiles.get()
}

def commonCoverageExclusions = [
  '**/uk/gov/hmcts/appregister/generated/**/*.class'
]

def sonarCoverageExclusions = [
  'src/main/java/uk/gov/hmcts/appregister/generated/**/*',
]

tasks.register('jacocoUnitReport', JacocoReport) {
  dependsOn tasks.named('test')
  reports {
    xml.required = true
    html.required = true
  }
  executionData layout.buildDirectory.file('jacoco/test.exec')
  sourceDirectories.from sourceSets.main.allSource.srcDirs

  classDirectories.setFrom(
    files(sourceSets.main.output).asFileTree.matching {
      exclude(commonCoverageExclusions)
    }
  )
}

tasks.register('jacocoUnitCoverageVerification', JacocoCoverageVerification) {
  dependsOn tasks.named('jacocoUnitReport')
  executionData.setFrom(layout.buildDirectory.file('jacoco/test.exec'))
  sourceDirectories.from sourceSets.main.allSource.srcDirs
  violationRules {
    failOnViolation = true
    rule {
      // optional: choose counter/value explicitly
      // counter = 'INSTRUCTION' // or BRANCH, CLASS, LINE, METHOD
      // value   = 'COVEREDRATIO'
      limit { minimum = 0.8 } // 80%
    }
  }

  classDirectories.setFrom(
    files(sourceSets.main.output).asFileTree.matching {
      exclude(commonCoverageExclusions)
    }
  )
}

tasks.register('jacocoIntegrationReport', JacocoReport) {
  dependsOn tasks.named('integration')
  reports {
    xml.required = true
    html.required = true
  }
  executionData layout.buildDirectory.file('jacoco/integration.exec')
  sourceDirectories.from sourceSets.main.allSource.srcDirs

  classDirectories.setFrom(
    files(sourceSets.main.output).asFileTree.matching {
      exclude(commonCoverageExclusions)
    }
  )
}

tasks.register('jacocoIntegrationCoverageVerification', JacocoCoverageVerification) {
  dependsOn tasks.named('jacocoIntegrationReport')
  executionData.setFrom(layout.buildDirectory.file('jacoco/integration.exec'))
  sourceDirectories.from sourceSets.main.allSource.srcDirs
  violationRules {
    failOnViolation = true
    rule {
      // optional: choose counter/value explicitly
      // counter = 'INSTRUCTION' // or BRANCH, CLASS, LINE, METHOD
      // value   = 'COVEREDRATIO'
      limit { minimum = 0.8 } // 80%
    }
  }

  classDirectories.setFrom(
    files(sourceSets.main.output).asFileTree.matching {
      exclude(commonCoverageExclusions)
    }
  )
}

['sonar', 'sonarqube'].each { sonarTaskName ->
  tasks.named(sonarTaskName) {
    dependsOn tasks.named('jacocoIntegrationCoverageVerification')
    dependsOn tasks.named('jacocoUnitCoverageVerification')
  }
}

tasks.named('check') {
  finalizedBy tasks.named('integration')
}


def xmls = [
  layout.buildDirectory.file('reports/jacoco/jacocoUnitReport/jacocoUnitReport.xml').get().asFile,
  layout.buildDirectory.file('reports/jacoco/jacocoIntegrationReport/jacocoIntegrationReport.xml').get().asFile
]

sonarqube {
  properties {
    property 'sonar.projectName', 'AppReg :: appreg-api'
    property 'sonar.projectKey', 'uk.gov.hmcts.appreg:appreg-api'
    property 'sonar.coverage.exclusions', sonarCoverageExclusions
    property(
      'sonar.coverage.jacoco.xmlReportPaths',
      xmls.collect { it.absolutePath }.join(',')
    )
  }
}

dependencyUpdates {
  def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { qualifier -> version.toUpperCase().contains(qualifier) }
    def regex = /^[0-9,.v-]+$/
    return !stableKeyword && !(version ==~ regex)
  }

  ComponentFilter rejectNonStableVersions = { ComponentSelectionWithCurrent selection ->
    return isNonStable(selection.candidate.version) && !isNonStable(selection.currentVersion)
  }
  rejectVersionIf rejectNonStableVersions
}

// https://jeremylong.github.io/DependencyCheck/dependency-check-gradle/configuration.html
dependencyCheck {
  // Specifies if the build should be failed if a CVSS score above a specified level is identified.
  // range of 0-10 fails the build, anything greater and it doesn't fail the build
  failBuildOnCVSS = 0
  suppressionFile = 'config/owasp/suppressions.xml'

  analyzers {
    // Disable scanning of .NET related binaries
    assemblyEnabled = false
  }
}

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    url = uri('https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1')
  }
}

ext {
  log4JVersion = '2.26.1'
}

ext['snakeyaml.version'] = '2.0'
ext['tomcat.version'] = '11.0.23'

dependencies {
  // Core Spring Boot Starters
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-jackson2'
  implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
  implementation 'io.micrometer:micrometer-tracing-bridge-brave'

  // Allows us to use Jackson 2 until we can successfully migrate to Jackson 3.
  implementation 'org.springframework.cloud:spring-cloud-starter'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.openapitools:jackson-databind-nullable:0.2.10'

  // OAuth2 support
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

  // Logging
  implementation 'com.github.hmcts.java-logging:logging:8.0.0'
  implementation "org.apache.logging.log4j:log4j-api:${log4JVersion}"
  implementation "org.apache.logging.log4j:log4j-to-slf4j:${log4JVersion}"
  implementation 'org.springframework.boot:spring-boot-starter-security'

  implementation 'org.springframework.boot:spring-boot-starter-flyway'

  implementation 'jakarta.validation:jakarta.validation-api:3.1.1'

  implementation 'io.swagger.core.v3:swagger-annotations:2.2.52'

  implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.1'

  implementation 'org.flywaydb:flyway-database-postgresql:12.10.0'
  
  // Future Jackson 2 overrides for CVE-2026-54515.
  // Leave commented until the FasterXML 2.x fixes are actually published to Maven Central.
  // implementation 'com.fasterxml.jackson.core:jackson-core:2.21.5'
  // implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.5'
  // implementation 'com.fasterxml.jackson.core:jackson-annotations:2.21.5'

  implementation 'org.flywaydb:flyway-database-postgresql:12.10.0'

  implementation 'org.springframework.boot:spring-boot-starter-validation'

  // Source: https://mvnrepository.com/artifact/tools.jackson.core/jackson-core
  implementation 'tools.jackson.core:jackson-core:3.2.0'

  // Source: https://mvnrepository.com/artifact/tools.jackson.core/jackson-databind
  implementation 'tools.jackson.core:jackson-databind:3.2.0'

  // Source: https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-annotations
  implementation 'com.fasterxml.jackson.core:jackson-annotations:2.22'

  // Source: https://mvnrepository.com/artifact/com.opencsv/opencsv
  implementation 'com.opencsv:opencsv:5.12.0'

  // A hibernate library that generates column constants
  annotationProcessor 'org.hibernate.orm:hibernate-processor:7.4.4.Final'
  annotationProcessor 'org.hibernate.orm:hibernate-core:7.4.4.Final'

  // Lombok
  compileOnly 'org.projectlombok:lombok:1.18.46'
  compileOnly 'org.jetbrains.kotlin:kotlin-stdlib'
  annotationProcessor 'org.projectlombok:lombok:1.18.46'

  // Database
  runtimeOnly 'org.postgresql:postgresql:42.7.13'
  localDebugRuntimeOnly 'p6spy:p6spy:3.9.1'

  // Testing
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

  testImplementation 'io.rest-assured:rest-assured:6.0.0'

  testImplementation 'com.squareup.okhttp3:mockwebserver:5.4.0'
  testImplementation 'io.github.hakky54:logcaptor:2.12.6'
  testImplementation 'org.testcontainers:testcontainers:2.0.5'
  testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
  testImplementation 'org.wiremock.integrations:wiremock-spring-boot:4.2.1'
  testImplementation 'org.instancio:instancio-junit:5.6.0'

  testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
  testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'

  rewrite 'org.openrewrite.recipe:rewrite-static-analysis:2.38.0'

  // Updated Third-Party Dependencies
  implementation 'org.apache.commons:commons-lang3:3.20.0'
  // Mapstruct dependency
  implementation 'org.mapstruct:mapstruct:1.6.3'
  annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
  testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
}

bootJar {
  archiveFileName = 'app-register.jar'

  manifest {
    attributes('Implementation-Version': project.version.toString())
  }
}

// Gradle 7.x issue, workaround from: https://github.com/gradle/gradle/issues/17236#issuecomment-894768083
rootProject.tasks.named('processSmokeTestResources') {
  duplicatesStrategy = 'include'
}

rootProject.tasks.named('processFunctionalTestResources') {
  duplicatesStrategy = 'include'
}

rootProject.tasks.named('processIntegrationTestResources') {
  duplicatesStrategy = 'include'
}

wrapper {
  distributionType = Wrapper.DistributionType.ALL
}

tasks.named('processResources', Copy) {
  def artifactVersion = project.version.toString()

  dependsOn tasks.named('openApiGenerate')
  dependsOn tasks.named('openapiJarArtefact')
  dependsOn tasks.named('flywayArtefact')

  inputs.property('version', artifactVersion)

  filesMatching('openapi/openapi.yaml') {
    filteringCharset = 'UTF-8'
    filter { String line -> line.replace('@version@', artifactVersion) }
  }
}

// Generate spring annotated methods inside a generated java package for ease of identification
tasks.named('openApiGenerate') {
  generatorName = 'spring'
  inputSpec = layout.projectDirectory.file('src/main/resources/openapi/openapi.yaml')
  outputDir = layout.buildDirectory.dir('generated/openapi')
  apiPackage = 'uk.gov.hmcts.appregister.generated.api'
  modelPackage = 'uk.gov.hmcts.appregister.generated.model'
  skipOperationExample = true
  openapiNormalizer = [
    REF_AS_PARENT_IN_ALLOF: 'true'
  ]
  configOptions = [
    dateLibrary                         : 'java8',
    interfaceOnly                       : 'true',
    useTags                             : 'true',
    useSpringBoot3                      : 'true',
    containerDefaultToNull              : 'true',
    generatedConstructorWithRequiredArgs: 'false',
    additionalModelTypeAnnotations      : '@lombok.AllArgsConstructor;@lombok.NoArgsConstructor;@SuppressWarnings("deprecation")',
    openApiNullable                     : 'true'
  ]
  typeMappings = [
    time: 'LocalTime'    // Map custom `format: time` → LocalTime
  ]
  importMappings = [
    LocalTime: 'java.time.LocalTime'
  ]
  modelNameMappings = [
    'entry-get-detail-dto_1': 'EntryGetDetailDto',
    'entry-page_1'          : 'EntryPage'
  ]

  inputs.files(fileTree('src/main/resources/openapi'))
  dependsOn tasks.named('copyBundledOpenApiYamlToRoot')
}

// Add a new jar that will be published to maven with the classifier -openapi
tasks.register('openapiJarArtefact', Jar) {
  archiveClassifier = 'openapi'
  from new File("$rootDir/src/main/resources/openapi")
}

// Add a new jar that will be published to maven with the classifier -flyway
tasks.register('flywayArtefact', Jar) {
  archiveClassifier = 'flyway'
  from new File('./flyway/migrations'), new File('./flyway/data_population')
}

tasks.register('bundleOpenApiJson', GenerateTask) {
  generatorName = 'openapi'
  inputSpec = layout.projectDirectory.file('src/main/resources/openapi/openapi.yaml')
  outputDir = layout.buildDirectory.dir('specmerge/json')
  additionalProperties = [
    outputFileName: 'openapi.json'
  ]
  inputs.files(fileTree('src/main/resources/openapi'))
}

tasks.register('bundleOpenApiYaml', GenerateTask) {
  generatorName = 'openapi-yaml'
  inputSpec = layout.projectDirectory.file('src/main/resources/openapi/openapi.yaml')
  outputDir = layout.buildDirectory.dir('specmerge/yaml')
  additionalProperties = [
    outputFile: 'openapi.yaml'
  ]
  inputs.files(fileTree('src/main/resources/openapi'))
}

tasks.register('copyBundledOpenApiYamlToRoot') {
  dependsOn tasks.named('bundleOpenApiYaml')
  def bundledSpec = layout.buildDirectory.file('specmerge/yaml/openapi.yaml')
  def rootSpec = layout.projectDirectory.file('openapi.yaml')

  inputs.file(bundledSpec)
  outputs.file(rootSpec)

  doLast {
    copy {
      from bundledSpec
      into layout.projectDirectory
    }
  }
}

tasks.named('assemble') {
  dependsOn tasks.named('copyBundledOpenApiYamlToRoot')
}

tasks.register('copySpecIntoLocalDebugResources', Copy) {
  dependsOn tasks.named('bundleOpenApiJson')
  from layout.buildDirectory.file('specmerge/json/openapi.json')
  into layout.buildDirectory.dir('localDebug/resources/static/specs')
}

tasks.named('compileJava') {
  dependsOn tasks.named('openApiGenerate')
}


rootProject.tasks.named('processTestResources') {
  duplicatesStrategy = 'include'
}

// publishing configuration
publishing {
  publications {
    maven(MavenPublication) {
      artifact tasks.named('openapiJarArtefact')
      artifact tasks.named('flywayArtefact')
    }
  }
  repositories {
    maven {
      name = 'AzureArtifacts'
      url = uri('https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1')
      credentials {
        username = System.getenv('AZURE_DEVOPS_ARTIFACT_USERNAME')
        password = System.getenv('AZURE_DEVOPS_ARTIFACT_TOKEN')
      }
    }
  }

  licenseReport {
    outputDir = layout.buildDirectory.dir('reports/dependency-license').get().asFile.toString()

    configurations = ['runtimeClasspath']

    renderers = [
      new JsonReportRenderer(),
      new SimpleHtmlReportRenderer()
    ]

    filters = [
      new LicenseBundleNormalizer()
    ]
  }
}
